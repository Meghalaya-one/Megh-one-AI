  village:
    name_column: lgd_village_name
    code_column: village_code
    stored_case: >
      Title Case in dim_geography.lgd_village_name. UNLIKE district and block, the village
      name is NOT uppercased in the curated layer.
    distinct_names: 4712
    distinct_codes: 4976
    unresolved_shgs: 2032
    integrity: >
      Verified clean in the source: no village code carries more than one name, and no
      village code appears in more than one block. The code is a reliable key; the NAME
      is not.
    sql_predicate_preferred: "village_code = <lgd_code>"
    sql_predicate_fallback: "lgd_village_name = '<canonical>'"
    counting_villages: >
      Use COUNT(DISTINCT village_code) FILTER (WHERE entity_type <> 'Unresolved'), never
      COUNT(DISTINCT name) - 264 villages would be lost to shared names, and the
      placeholders would be counted as villages.
    unresolved_placeholder:
      critical: true
      text: >
        The 2,032 SHGs with no source village carry their BLOCK's synthetic Unresolved
        placeholder code. That code is not a village. Never return it as a village match,
        never list its label as a village name, never count it as a village.
    not_gp: >
      A place name that matches only gp_name (and no LGD village) is NOT a village. Return
      ambiguous offering the GP reading, or not_found.

    resolution_strategy:
    - 1. If the user gave a 6-digit numeric code, resolve on village_code directly.
    - 2. Fold the name and look it up scoped by any district or block also given.
    - 3. If exactly one code survives, resolve and emit the CODE, not the name.
    - 4. If more than one survives, return ambiguous with candidate codes plus their
         district and block. Ask which one.
    - 5. If none survive, run fuzzy then embedding, then not_found with 5 suggestions.

    ambiguity:
      shared_names: 197
      detail: >
        197 village names are used by two or more physically different villages. Village
        name alone is NEVER a key.
      resolve_by_district: 160
      resolve_by_block: 37      # every copy sits in ONE district, so naming the
                                # district does not help - ask for the block
