  gp_name:
    column: gp_name
    status: advisory
    stored_case: as typed in the source (mostly Title Case, e.g. 'Kyndong Tuber')
    distinct: 3990
    nulls: 0
    lgd_level: false
    sql_predicate: "gp_name ILIKE '<canonical>'"
    rule: >
      Free text with no code and no place in the LGD hierarchy. The same GP name appears
      in more than one block. Resolve only when the user names the GP level, scope it by
      block whenever a block is known, and attach the caveat that it differs from the LGD
      village on about a quarter of SHGs.
    sample_values: [Madanmaroid, Barato, Kyndong Tuber, Mawlong, Rymbai, Mawryng Kneng]
    spelling_note: >
      GP and village spellings of the same place often differ by a space ('Kyndong Tuber'
      vs village 'Kyndongtuber', 'Mawryng Kneng' vs 'Mawryngkneng'). Use the squash stage.

  shg_type:
    column: shg_type
    stored_case: as shown
    distinct: 3
    closed_set: true
    nulls: 0
    sql_predicate: "shg_type = '<canonical>'"
    ordering: Pre-Nrlm -> Revived -> New
    values:
    - canonical: "New"
      shgs: 38453
      active: 37313
      members: 387333
      rf_crore: 47.99
      cif_crore: 92.86
      aliases: ["new", "newly formed", "new SHG", "new group", "NRLM formed", "fresh", "new type"]
      collision: "'New' as a type vs 'newly formed recently' - see overloaded_terms.new"
    - canonical: "Revived"
      shgs: 1744
      active: 1689
      members: 18801
      rf_crore: 2.27
      cif_crore: 3.88
      aliases: ["revived", "revival", "revitalised", "revitalized", "reactivated", "re-formed", "reformed", "revived SHG"]
    - canonical: "Pre-Nrlm"
      shgs: 432
      active: 430
      members: 4713
      rf_crore: 0.60
      cif_crore: 1.73
      aliases: ["pre NRLM", "pre-NRLM", "prenrlm", "pre NRLM SHG", "existing before NRLM", "old SHG", "SGSY SHG", "SGSY group", "legacy SHG"]
      collision: "'Pre-NRLM' as a type (432) vs 'formed before 2011-12' (645) - see overloaded_terms.pre_nrlm"
    definitions_note: Code list and definitions are unconfirmed by the client (readiness doc section 3).

  shg_status:
    column: is_active
    type: boolean
    nulls: 0
    values:
    - canonical: true
      label: Active
      shgs: 39432
      aliases: ["active", "functional", "working", "live", "operational", "running", "functioning"]
      sql_predicate: "is_active"
    - canonical: false
      label: Inactive
      shgs: 1197
      aliases: ["inactive", "dormant", "defunct", "non-functional", "nonfunctional", "not active", "closed", "dissolved", "defunct SHG"]
      sql_predicate: "NOT is_active"
      note: >
        'closed' and 'dissolved' resolve here only with a stated assumption - there is no
        dissolution status, only the active flag. All 1,197 show 0 RF and 0 CIF (NR-15).

  formation_year:
    stored_column: formation_financial_year_short on curated.v_nrlm
    long_column: formation_financial_year
    key_column: formation_year_key
    source: curated.dim_year, pre-joined into curated.v_nrlm
    definition: April 1 to March 31, labelled 'YYYY-YY', the year the SHG was FORMED
    meaning:
      critical: true
      text: >
        This is the FORMATION year (live comment, NR-02) - not a reporting, funding or
        release year. Resolve a year to it only for SHG count, member and formation
        questions. A year attached to money is handed to the gate.
    sql_predicate: "formation_financial_year_short = '<canonical>'"
    sql_predicate_before: "formation_financial_year_short < '<canonical>'"
    sql_predicate_after: "formation_financial_year_short > '<canonical>'"
    range: { first: '1984-85', last: '2022-23', distinct: 30 }
    absent_years_inside_range: ['1985-86', '1986-87', '1987-88', '1988-89', '1989-90', '1990-91',
                                '1991-92', '1992-93', '1994-95']
    accepted_forms:
    - "2020-21"       # canonical
    - "2020-2021"     # long form -> formation_financial_year
    - "FY 2020-21"
    - "FY20-21"
    - "FY21"          # ambiguous between 2020-21 and 2021-22 - ask (ambiguous_year_shorthand)
    - "2020"          # bare year - ask (bare_year_formation_or_fy) unless context is formation
    values:
    - { canonical: '2022-23', shgs: 1680, note: "latest; may be incomplete in this extract" }
    - { canonical: '2021-22', shgs: 6028 }
    - { canonical: '2020-21', shgs: 11354, note: peak }
    - { canonical: '2019-20', shgs: 10604 }
    - { canonical: '2018-19', shgs: 4368 }
    - { canonical: '2017-18', shgs: 3634 }
    - { canonical: '2016-17', shgs: 1279 }
    - { canonical: '2015-16', shgs: 582 }
    - { canonical: '2014-15', shgs: 169 }
    - { canonical: '2013-14', shgs: 98 }
    - { canonical: '2012-13', shgs: 83 }
    - { canonical: '2011-12', shgs: 105, note: NRLM launch year }
    - { canonical: '2010-11', shgs: 77 }
    - { canonical: '2009-10', shgs: 56 }
    - { canonical: '2008-09', shgs: 71 }
    - { canonical: '2007-08', shgs: 81 }
    - { canonical: '2006-07', shgs: 82 }
    - { canonical: '2005-06', shgs: 48 }
    - { canonical: '2004-05', shgs: 53 }
    - { canonical: '2003-04', shgs: 49 }
    - { canonical: '2002-03', shgs: 56 }
    - { canonical: '2001-02', shgs: 33 }
    - { canonical: '2000-01', shgs: 21 }
    - { canonical: '1999-00', shgs: 8, note: "stored short form is '1999-00', not '1999-2000'" }
    - { canonical: '1998-99', shgs: 3 }
    - { canonical: '1997-98', shgs: 2 }
    - { canonical: '1996-97', shgs: 2 }
    - { canonical: '1995-96', shgs: 1 }
    - { canonical: '1993-94', shgs: 1 }
    - { canonical: '1984-85', shgs: 1 }
    relative_terms:
      latest: '2022-23'
      previous: '2021-22'
      earliest: '1984-85'
      before_nrlm: "< '2011-12'"
      this_year: "not held - the data stops at 2022-23. Say so; do not return 0 silently."
    dim_year_coverage_conflict:
      unresolved: true
      text: >
        The 2026-10-05 schema doc estimates dim_year at ~9 rows, but formation_year_key is
        NOT NULL with an FK to dim_year and needs 30 distinct years, and the reconciliation
        view expects 0 quarantined. Either the row estimate is stale or dim_year was
        extended for NRLM. The view uses an INNER JOIN to dim_year - if a year were
        missing, SHGs would vanish from every query. Verify before shipping.

  identifiers:
    shg_code:
      column: shg_code
      type: integer
      unique: true
      range: [2, 46368]
      role: THE natural key of an SHG. Unique constraint fact_nrlm_shg_shg_code_key.
      aliases: [SHG code, SHG id, SHG number, group code, group id, group number]
      sql_predicate: "shg_code = <int>"
      rule: identifier only - never SUM or AVG.
      parse: >
        Accept 'SHG 7194', 'SHG code 7194', '#7194', 'code 7194'. A bare 4-5 digit number
        is an shg_code only when the question is about a single group; a 6-digit number is
        a village code; a 3-digit number may be a district code; a 4-digit number may also be
        a block code - ask when the context does not decide.
    shg_name:
      column: shg_name
      unique: false
      distinct: 27692
      most_shared: { "Iatreilang Shg": 295, "Iatyllilang Shg": 204, "Synroplang Shg": 137,
                     "Chibasal Shg": 125, "Iatreilang": 109, "Tyllilang Shg": 104 }
      same_name_same_village: 174
      sql_predicate: "shg_name ILIKE '<canonical>'"
      rule: >
        Resolve to a LIST, never to one SHG, unless exactly one row matches. Return
        ambiguous with shg_code, village, block and district per candidate. Scope by any
        geography the user gave before counting candidates.
      variant_note: >
        'Iatreilang' and 'Iatreilang Shg' are different stored strings for what are
        separate SHGs. A search for the bare word should match both (ILIKE '<word>%').
    nrlm_fact_id:
      column: nrlm_fact_id
      type: bigint
      unique: true
      role: surrogate primary key
      unstable: Regenerated on every reload (the table is replaced). Never quote it back to a user.
      rule: identifier only - never SUM or AVG.
    source_row_id:
      column: fact_nrlm_shg.source_row_id
      role: >
        The source file's `id`. Not in the view. A user who says "row id" or "record id"
        from the spreadsheet means this - answer from fact_nrlm_shg only for lineage.

measure_vocabulary:
  shgs:
    aggregate: COUNT(*)
    aliases: [SHGs, groups, self help groups, number of SHGs, SHG count, how many SHGs, collectives]
    unit: SHGs
  members:
    column: total_members
    aggregate: SUM(total_members)
    aliases: [members, membership, total members, SHG members, people, persons, women mobilised]
    unit: persons
    note: Households are NOT recorded; 'households' resolves here only with a stated assumption.
  women_members:
    column: female_members
    aggregate: SUM(female_members)
    aliases: [women, women members, female members, female, mahila]
  men_members:
    column: male_members
    aggregate: SUM(male_members)
    aliases: [men, male members, male]
  revolving_fund:
    column: revolving_fund_amount
    aggregate: SUM(revolving_fund_amount)
    aliases: [revolving fund, RF, RF amount, revolving fund amount, RF released, RF received, RF disbursed]
    unit: rupees (assumed, NR-07)
    distinct_values: 10
    norm: 15000
    cumulative: true
    note: >
      Effectively a flat entitlement - 33,241 SHGs hold exactly Rs 15,000. A ranking by
      total RF is close to a ranking by count of RF-receiving SHGs. Say so when ranking.
  cif:
    column: cif_amount
    aggregate: SUM(cif_amount)
    aliases: [CIF, community investment fund, CIF amount, investment fund, CIF released, CIF received, CIF disbursed]
    unit: rupees (assumed, NR-07)
    distinct_values: 355
    zero_share: 0.733
    cumulative: true
    note: The measure that genuinely varies. 39 values above Rs 5 lakh are unconfirmed (NR-25).
  total_funds:
    expression: SUM(revolving_fund_amount + cif_amount)
    aliases: [total funds, total community funds, RF plus CIF, all funds]
    note: Only when the user asks for the combined figure.
  derived:
    active_share: "ROUND(100.0 * COUNT(*) FILTER (WHERE is_active) / COUNT(*), 2)"
    cif_coverage: "ROUND(100.0 * COUNT(*) FILTER (WHERE cif_amount > 0) / COUNT(*), 2)"
    rf_coverage: "ROUND(100.0 * COUNT(*) FILTER (WHERE revolving_fund_amount > 0) / COUNT(*), 2)"
    members_per_shg: "ROUND(AVG(total_members), 1)"
    cif_per_recipient: "ROUND(AVG(cif_amount) FILTER (WHERE cif_amount > 0), 0)"
  not_held:
    - savings / corpus / internal lending
    - bank linkage / bank loan / credit / loan outstanding / repayment / NPA
    - start-up fund / vulnerability reduction fund / interest subvention
    - utilisation / expenditure of funds
    - households / population / eligible women

region_groupings:
  note: >
    Users group districts by hill range. These are not columns - expand into an IN list
    (by district_lgd_code) and state which districts were included. Counts are by LGD code.
  groups:
    "Garo Hills":
      districts: [East Garo Hills, North Garo Hills, South Garo Hills,
                  South West Garo Hills, West Garo Hills]
      district_codes: [273, 656, 277, 663, 278]
      shgs: 17565
      aliases: [Garo, Garo region, Garo Hills region, GH]
    "Khasi Hills":
      districts: [East Khasi Hills, Eastern West Khasi Hills, South West Khasi Hills,
                  West Khasi Hills]
      district_codes: [274, 740, 658, 279]
      shgs: 12557
      aliases: [Khasi, Khasi region, Khasi Hills region, KH]
    "Jaintia Hills":
      districts: [East Jaintia Hills, West Jaintia Hills]
      district_codes: [657, 275]
      shgs: 6799
      aliases: [Jaintia, Jaintia region, Jaintia Hills region, JH]
    "Ri Bhoi":
      districts: [Ri Bhoi]
      district_codes: [276]
      shgs: 3708
      aliases: [Ri Bhoi region, Bhoi]
      note: >
        Ri Bhoi belongs to no hill range - it is its own district and its own group. Do not
        fold it into Khasi Hills.
  whole_state:
    aliases: [Meghalaya, state, statewide, whole state, all districts, overall]
    behaviour: no district filter at all.
    shgs: 40629

# ---------------------------------------------------------------------------
# WORKED EXAMPLES
# ---------------------------------------------------------------------------
worked_examples:

- user: "how many SHGs in EGH"
  resolve:
  - { text: EGH, type: district, canonical: East Garo Hills, lgd_code: 273,
      matched_by: 4_acronym }
  - { text: "how many SHGs", type: measure, canonical: "COUNT(*)" }
  sql: "SELECT COUNT(*) FROM curated.v_nrlm WHERE lgd_district = 'EAST GARO HILLS';"
  expected: 2700

- user: "SHGs in district 657"
  resolve:
  - { text: "657", type: district, canonical: East Jaintia Hills, lgd_code: 657, matched_by: 1_exact }
  sql: "SELECT COUNT(*) FROM curated.v_nrlm WHERE district_lgd_code = 657;"
  expected: 2744
  note: >
    By code. A source-name count would give 2,732 - the 12 Tangnub SHGs are named
    Eastern West Khasi Hills in the file but coded 657.

- user: "women members in west khasi"
  resolve:
  - { text: "west khasi", type: district, canonical: West Khasi Hills, lgd_code: 279, matched_by: 2_alias }
  - { text: "women members", type: measure, canonical: "SUM(female_members)" }
  note: >
    "west khasi" must NOT fuzzy-match Eastern West Khasi Hills (blocked pair). If the user
    meant 740 they will say "eastern".

- user: "SHGs in Mawlai"
  resolve:
  - { text: Mawlai, type: block, canonical: Mawlai, lgd_code: 6540,
      assumption: default_level }
  note: >
    Mawlai is a block (168 SHGs), a constituency (168 SHGs) and a village in Shallang
    block (5 SHGs). With no qualifier the default is block; state it.

- user: "SHGs in Asimgre"
  resolve:
  - { text: Asimgre, type: village, status: ambiguous }
  response:
    status: ambiguous
    candidates: 5 distinct village codes named ASIMGRE
    districts: [East Garo Hills, South Garo Hills, South West Garo Hills, West Garo Hills]
    question: "Asimgre exists in four districts - and twice in West Garo Hills (Dadenggiri and Dalu blocks). Which one did you mean?"
  note: never pick the first row.

- user: "SHGs in Nongbah village"
  resolve:
  - { text: Nongbah, type: village, status: ambiguous }
  response:
    candidates:
    - { village_code: 279159, block: Thadlaskein, district: West Jaintia Hills, shgs: 79 }
    - { village_code: 276721, block: Rambrai, district: West Khasi Hills, shgs: 9 }
    question: "Nongbah in Thadlaskein (West Jaintia Hills) or in Rambrai (West Khasi Hills)?"

- user: "show Iatreilang Shg"
  resolve:
  - { text: Iatreilang Shg, type: shg_name, status: ambiguous, matches: 295 }
  response_guidance: >
    295 SHGs share this name across 7 districts. Ask for the district, block or SHG code;
    or, if the user wants them all, list with shg_code, village and block (LIMIT 100).

- user: "SHG 3329"
  resolve:
  - { text: "SHG 3329", type: shg_code, canonical: 3329, matched_by: 1_exact }
  sql: "SELECT * FROM curated.v_nrlm WHERE shg_code = 3329;"
  note: Unique - exactly one row (the largest CIF holder, Rs 13.6 lakh - carry the NR-25 caveat).

- user: "SHGs in Mawkyrwat constituency"
  resolve:
  - { text: Mawkyrwat, type: constituency, canonical: Mawkyrwat, number: 36,
      matched_by: 1_exact, qualifier: constituency }
  sql: "SELECT COUNT(*) FROM curated.v_nrlm WHERE constituency_name_raw = 'Mawkyrwat';"
  expected: 1092
  note: The block of the same name holds 1,106 SHGs. Different area.

- user: "SHGs in Sohiong constituency"
  resolve:
  - { text: Sohiong, type: constituency, canonical: Sohing, number: 23, matched_by: 2_alias }
  note: >
    The name field stores 'Sohing'; the numbered field says '23 SOHIONG'. Both resolve to
    the same constituency. Without "constituency", Sohiong is the BLOCK (6542).

- user: "how many revived SHGs formed in 2019-20"
  resolve:
  - { text: revived, type: shg_type, canonical: Revived }
  - { text: "2019-20", type: formation_year, canonical: '2019-20' }
  sql: "SELECT COUNT(*) FROM curated.v_nrlm WHERE shg_type = 'Revived' AND formation_financial_year_short = '2019-20';"

- user: "RF released in 2021-22"
  resolve:
  - { text: RF released, type: measure, canonical: revolving_fund_amount }
  - { text: "2021-22", type: formation_year, status: refused_for_money }
  response: >
    Gate: money_in_a_year_requested. The year cannot be applied to a cumulative undated
    amount. Offer "RF held by SHGs formed in 2021-22", labelled as such.

- user: "dormant groups in Ri Bhoi"
  resolve:
  - { text: dormant, type: shg_status, canonical: false, matched_by: 2_alias }
  - { text: Ri Bhoi, type: district, canonical: Ri Bhoi, lgd_code: 276 }
  sql: "SELECT COUNT(*) FROM curated.v_nrlm WHERE NOT is_active AND lgd_district = 'RI BHOI';"
  note: State that 'dormant' was read as inactive - the only status besides active.

- user: "SHGs in Khasi Hills"
  resolve:
  - { text: Khasi Hills, type: region, districts: [274, 740, 658, 279] }
  sql: "SELECT COUNT(*) FROM curated.v_nrlm WHERE district_lgd_code IN (274, 740, 658, 279);"
  expected: 12557
  note: Name the four districts in the answer. Ri Bhoi is not included.

- user: "how many beneficiaries in NRLM"
  resolve:
  - { text: beneficiaries, type: measure, status: ambiguous }
  question: "SHGs (40,629) or SHG members (410,847)?"

- user: "SHG savings in Jirang"
  resolve:
  - { text: savings, type: measure, status: not_found }
  response: >
    Not held. Gate: savings_or_corpus_requested. Offer RF and CIF received, and never
    present them as savings.

