# nrlm_few_shot.yaml
#
# Validated question-to-SQL pairs for NRLM - node 5.10.
#
# ===========================================================================
# v1.0 - 2026-10-05 - FIRST VERSION, WRITTEN AGAINST THE CURATED STAR SCHEMA
#
# Every example runs against curated.v_nrlm (29 columns, one row per SHG).
#
# House rules encoded in every example below:
#   FROM curated.v_nrlm                  never fact_nrlm_shg, except for lineage
#   COUNT(*)                             is an SHG count - one row is one SHG
#   SUM(total_members)                   is a member count - never COUNT(*)
#   formation_financial_year_short       the ONLY year, and it is the FORMATION year
#   money is never grouped or filtered by year - it is cumulative and undated
#   lgd_district / lgd_block             UPPERCASE literals - dim_geography stores them so
#   district_lgd_code / block_lgd_code   authoritative, and safe from the casing trap
#   entity_type <> 'Unresolved'          on village counts, lists and rankings ONLY
#   village_code                         for counting villages, never a name
#   shg_code                             for a single SHG, never shg_name
#   amounts are RUPEES (assumed, NR-07)  divide by 1e7 for crore, and say the unit
#
# Questions NRLM must refuse (money by year, growth, savings, federations,
# members by name, formation date) have no SQL and are NOT in this file - they
# are in nrlm_schema_partitions.yaml few_shot_examples with sql: null, and the
# gate in nrlm_classification_rules.yaml catches them first.
#
# NOT ONE OF THESE QUERIES HAS BEEN EXECUTED against megh_db. They are correct
# against the structure in SCHEMA_FOR_DEVELOPERS.md (2026-10-05) and the expected
# values quoted in `expected` come from datasets/NRLM/NRLM.csv. Run them before
# trusting a result.
# ===========================================================================

sql_generation_examples:

# ---- SHG counts -----------------------------------------------------------
- question: How many SHGs are there?
  sql: |
    SELECT COUNT(*) AS shgs
    FROM curated.v_nrlm;
  tables:
  - curated.v_nrlm
  expected: 40629
- question: How many self help groups are there in Meghalaya, active and inactive?
  sql: |
    SELECT COUNT(*)                                AS shgs,
           COUNT(*) FILTER (WHERE is_active)       AS active,
           COUNT(*) FILTER (WHERE NOT is_active)   AS inactive
    FROM curated.v_nrlm;
  tables:
  - curated.v_nrlm
  expected: {shgs: 40629, active: 39432, inactive: 1197}
- question: How many active SHGs are there?
  sql: |
    SELECT COUNT(*) AS active_shgs
    FROM curated.v_nrlm
    WHERE is_active;
  tables:
  - curated.v_nrlm
  expected: 39432
- question: How many inactive SHGs are there?
  sql: |
    SELECT COUNT(*) AS inactive_shgs
    FROM curated.v_nrlm
    WHERE NOT is_active;
  tables:
  - curated.v_nrlm
  expected: 1197
  note: is_active is NOT NULL, so NOT is_active is the exact complement - no IS DISTINCT FROM needed.
- question: How many SHGs are there in East Khasi Hills?
  sql: |
    SELECT COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE lgd_district = 'EAST KHASI HILLS';
  tables:
  - curated.v_nrlm
  expected: 6768
- question: How many SHGs are there in district 657?
  sql: |
    SELECT COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE district_lgd_code = 657;
  tables:
  - curated.v_nrlm
  expected: 2744
  note: By LGD code. The source file names 12 of these SHGs 'Eastern West Khasi Hills', so a source-name count gives 2,732.
- question: SHGs by district
  sql: |
    SELECT lgd_district, COUNT(*) AS shgs
    FROM curated.v_nrlm
    GROUP BY lgd_district
    ORDER BY shgs DESC
    LIMIT 12;
  tables:
  - curated.v_nrlm
- question: Which district has the most SHGs?
  sql: |
    SELECT lgd_district, COUNT(*) AS shgs
    FROM curated.v_nrlm
    GROUP BY lgd_district
    ORDER BY shgs DESC
    LIMIT 1;
  tables:
  - curated.v_nrlm
  expected: {lgd_district: EAST KHASI HILLS, shgs: 6768}
- question: Which district has the fewest SHGs?
  sql: |
    SELECT lgd_district, COUNT(*) AS shgs
    FROM curated.v_nrlm
    GROUP BY lgd_district
    ORDER BY shgs ASC
    LIMIT 1;
  tables:
  - curated.v_nrlm
  expected: {lgd_district: EASTERN WEST KHASI HILLS, shgs: 1610}
- question: SHGs by block in West Jaintia Hills
  sql: |
    SELECT lgd_block, block_lgd_code, COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE lgd_district = 'WEST JAINTIA HILLS'
    GROUP BY lgd_block, block_lgd_code
    ORDER BY shgs DESC;
  tables:
  - curated.v_nrlm
- question: Top blocks by number of SHGs
  sql: |
    SELECT lgd_block, lgd_district, COUNT(*) AS shgs
    FROM curated.v_nrlm
    GROUP BY lgd_block, lgd_district
    ORDER BY shgs DESC
    LIMIT 5;
  tables:
  - curated.v_nrlm
  note: No N supplied, so top 5. Laskein (1,880) leads.
- question: How many SHGs are in Mawkyrwat block?
  sql: |
    SELECT COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE lgd_block = 'MAWKYRWAT';
  tables:
  - curated.v_nrlm
  expected: 1106
  note: Mawkyrwat is also a constituency (1,092 SHGs) and a village. The word "block" settles it.
- question: How many SHGs are in the Garo Hills?
  sql: |
    SELECT COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE district_lgd_code IN (273, 656, 277, 663, 278);
  tables:
  - curated.v_nrlm
  expected: 17565
  note: Region expanded to its five districts by code. Name them in the answer.
- question: How many SHGs are of each type?
  sql: |
    SELECT shg_type, COUNT(*) AS shgs
    FROM curated.v_nrlm
    GROUP BY shg_type
    ORDER BY CASE shg_type WHEN 'Pre-Nrlm' THEN 1 WHEN 'Revived' THEN 2 WHEN 'New' THEN 3 END;
  tables:
  - curated.v_nrlm
- question: How many revived SHGs are active?
  sql: |
    SELECT COUNT(*) AS active_revived_shgs
    FROM curated.v_nrlm
    WHERE shg_type = 'Revived'
      AND is_active;
  tables:
  - curated.v_nrlm
  expected: 1689
- question: Share of SHGs active by district
  sql: |
    SELECT lgd_district,
           COUNT(*) AS shgs,
           COUNT(*) FILTER (WHERE is_active) AS active,
           ROUND(100.0 * COUNT(*) FILTER (WHERE is_active) / NULLIF(COUNT(*), 0), 2) AS active_pct
    FROM curated.v_nrlm
    GROUP BY lgd_district
    ORDER BY active_pct ASC
    LIMIT 12;
  tables:
  - curated.v_nrlm

# ---- formation year (the only year) ----------------------------------------
- question: How many SHGs were formed in 2020-21?
  sql: |
    SELECT COUNT(*) AS shgs_formed
    FROM curated.v_nrlm
    WHERE formation_financial_year_short = '2020-21';
  tables:
  - curated.v_nrlm
  expected: 11354
- question: How many SHGs were formed each year?
  sql: |
    SELECT CASE WHEN formation_financial_year_short < '2014-15' THEN 'before 2014-15'
                ELSE formation_financial_year_short END AS formation_year,
           COUNT(*) AS shgs_formed
    FROM curated.v_nrlm
    GROUP BY 1
    ORDER BY MIN(formation_financial_year_short);
  tables:
  - curated.v_nrlm
  note: >
    Default groups the sparse early years (931 SHGs) so the chart is readable. Order by
    MIN(year), not by the label - 'before 2014-15' would otherwise sort LAST, because
    digits sort before letters.
- question: How many SHGs were formed before NRLM started?
  sql: |
    SELECT COUNT(*) AS shgs_formed_before_2011_12
    FROM curated.v_nrlm
    WHERE formation_financial_year_short < '2011-12';
  tables:
  - curated.v_nrlm
  expected: 645
  note: Only after the gate settled that the user means the YEAR, not shg_type = 'Pre-Nrlm' (432).
- question: How many SHGs were formed after 2019-20 in Ri Bhoi?
  sql: |
    SELECT COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE formation_financial_year_short > '2019-20'
      AND lgd_district = 'RI BHOI';
  tables:
  - curated.v_nrlm
- question: In which year were the most SHGs formed?
  sql: |
    SELECT formation_financial_year_short, COUNT(*) AS shgs_formed
    FROM curated.v_nrlm
    GROUP BY formation_financial_year_short
    ORDER BY shgs_formed DESC
    LIMIT 1;
  tables:
  - curated.v_nrlm
  expected: {formation_financial_year_short: '2020-21', shgs_formed: 11354}
- question: Compare SHGs formed in 2019-20 and 2020-21 by district
  sql: |
    SELECT lgd_district,
           COUNT(*) FILTER (WHERE formation_financial_year_short = '2019-20') AS formed_2019_20,
           COUNT(*) FILTER (WHERE formation_financial_year_short = '2020-21') AS formed_2020_21
    FROM curated.v_nrlm
    WHERE formation_financial_year_short IN ('2019-20', '2020-21')
    GROUP BY lgd_district
    ORDER BY lgd_district;
  tables:
  - curated.v_nrlm
  note: A cohort comparison of COUNTS. Allowed. The same comparison of money is refused.
- question: Revived SHGs formed in 2019-20
  sql: |
    SELECT COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE shg_type = 'Revived'
      AND formation_financial_year_short = '2019-20';
  tables:
  - curated.v_nrlm

# ---- members --------------------------------------------------------------
- question: How many SHG members are there?
  sql: |
    SELECT SUM(total_members) AS members
    FROM curated.v_nrlm;
  tables:
  - curated.v_nrlm
  expected: 410847
  note: Members are a column. COUNT(*) would return 40,629 - the number of groups.
- question: How many women are members of SHGs?
  sql: |
    SELECT SUM(female_members) AS women_members,
           ROUND(100.0 * SUM(female_members) / NULLIF(SUM(total_members), 0), 2) AS women_pct
    FROM curated.v_nrlm;
  tables:
  - curated.v_nrlm
  expected: {women_members: 409249, women_pct: 99.61}
- question: Members by district
  sql: |
    SELECT lgd_district,
           SUM(total_members)  AS members,
           SUM(female_members) AS women,
           SUM(male_members)   AS men
    FROM curated.v_nrlm
    GROUP BY lgd_district
    ORDER BY members DESC
    LIMIT 12;
  tables:
  - curated.v_nrlm
- question: Average members per SHG by block in East Garo Hills
  sql: |
    SELECT lgd_block, COUNT(*) AS shgs, ROUND(AVG(total_members), 1) AS avg_members
    FROM curated.v_nrlm
    WHERE lgd_district = 'EAST GARO HILLS'
    GROUP BY lgd_block
    ORDER BY avg_members DESC;
  tables:
  - curated.v_nrlm
- question: How many SHGs have male members?
  sql: |
    SELECT COUNT(*) AS shgs_with_men
    FROM curated.v_nrlm
    WHERE male_members > 0;
  tables:
  - curated.v_nrlm
  expected: 705
- question: How many all-women SHGs are there?
  sql: |
    SELECT COUNT(*) AS all_women_shgs
    FROM curated.v_nrlm
    WHERE male_members = 0
      AND female_members > 0;
  tables:
  - curated.v_nrlm
  expected: 39919
  note: male_members = 0 alone gives 39,924 - it also includes the 5 SHGs with no members at all.
- question: How many SHGs have membership outside the NRLM norm?
  sql: |
    SELECT CASE WHEN total_members = 0 THEN '0 members'
                WHEN total_members < 5 THEN '1-4 members'
                ELSE 'above 20 members' END AS band,
           COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE member_count_out_of_norm
    GROUP BY 1
    ORDER BY 1;
  tables:
  - curated.v_nrlm
  expected: {'0 members': 5, '1-4 members': 74, 'above 20 members': 99}
- question: Which SHGs have no members recorded?
  sql: |
    SELECT shg_code, shg_name, lgd_district, lgd_block, is_active
    FROM curated.v_nrlm
    WHERE total_members = 0
    ORDER BY shg_code;
  tables:
  - curated.v_nrlm
  expected_rows: 5
- question: Distribution of SHG size
  sql: |
    SELECT total_members, COUNT(*) AS shgs
    FROM curated.v_nrlm
    GROUP BY total_members
    ORDER BY total_members;
  tables:
  - curated.v_nrlm

# ---- funds (cumulative, undated) ---------------------------------------------
- question: What is the total Revolving Fund received by SHGs?
  sql: |
    SELECT ROUND(SUM(revolving_fund_amount) / 1e7, 2) AS rf_cr
    FROM curated.v_nrlm;
  tables:
  - curated.v_nrlm
  expected: 50.86
  note: Cumulative to the extract date, rupees assumed. Say both in the answer.
- question: What is the total Community Investment Fund?
  sql: |
    SELECT ROUND(SUM(cif_amount) / 1e7, 2) AS cif_cr
    FROM curated.v_nrlm;
  tables:
  - curated.v_nrlm
  expected: 98.48
- question: Total RF and CIF by district
  sql: |
    SELECT lgd_district,
           ROUND(SUM(revolving_fund_amount) / 1e7, 2) AS rf_cr,
           ROUND(SUM(cif_amount) / 1e7, 2)            AS cif_cr
    FROM curated.v_nrlm
    GROUP BY lgd_district
    ORDER BY cif_cr DESC
    LIMIT 12;
  tables:
  - curated.v_nrlm
- question: Which district received the most CIF?
  sql: |
    SELECT lgd_district, ROUND(SUM(cif_amount) / 1e7, 2) AS cif_cr
    FROM curated.v_nrlm
    GROUP BY lgd_district
    ORDER BY cif_cr DESC
    LIMIT 1;
  tables:
  - curated.v_nrlm
  expected: {lgd_district: WEST JAINTIA HILLS, cif_cr: 18.89}
- question: Total community funds (RF plus CIF) in Ri Bhoi
  sql: |
    SELECT ROUND(SUM(revolving_fund_amount + cif_amount) / 1e7, 2) AS total_funds_cr
    FROM curated.v_nrlm
    WHERE lgd_district = 'RI BHOI';
  tables:
  - curated.v_nrlm
  expected: 14.10
- question: How many SHGs have received Revolving Fund?
  sql: |
    SELECT COUNT(*) FILTER (WHERE revolving_fund_amount > 0) AS shgs_with_rf,
           ROUND(100.0 * COUNT(*) FILTER (WHERE revolving_fund_amount > 0) / COUNT(*), 2) AS rf_coverage_pct
    FROM curated.v_nrlm;
  tables:
  - curated.v_nrlm
  expected: {shgs_with_rf: 33700, rf_coverage_pct: 82.95}
- question: How many SHGs have not received CIF?
  sql: |
    SELECT COUNT(*) AS shgs_without_cif,
           COUNT(*) FILTER (WHERE NOT is_active) AS of_which_inactive
    FROM curated.v_nrlm
    WHERE cif_amount = 0;
  tables:
  - curated.v_nrlm
  expected: {shgs_without_cif: 29788, of_which_inactive: 1197}
- question: Active SHGs that have not received Revolving Fund, by district
  sql: |
    SELECT lgd_district, COUNT(*) AS active_shgs_without_rf
    FROM curated.v_nrlm
    WHERE is_active
      AND revolving_fund_amount = 0
    GROUP BY lgd_district
    ORDER BY active_shgs_without_rf DESC
    LIMIT 12;
  tables:
  - curated.v_nrlm
  note: Excludes inactive SHGs on purpose - they all show 0 RF and would swamp the result.
- question: What is the average CIF per SHG?
  sql: |
    SELECT ROUND(AVG(cif_amount), 0)                               AS avg_cif_all_shgs,
           ROUND(AVG(cif_amount) FILTER (WHERE cif_amount > 0), 0) AS avg_cif_among_recipients
    FROM curated.v_nrlm;
  tables:
  - curated.v_nrlm
  expected: {avg_cif_all_shgs: 24238, avg_cif_among_recipients: 90836}
- question: Distribution of Revolving Fund amounts
  sql: |
    SELECT revolving_fund_amount, COUNT(*) AS shgs
    FROM curated.v_nrlm
    GROUP BY revolving_fund_amount
    ORDER BY shgs DESC;
  tables:
  - curated.v_nrlm
  note: Ten values; Rs 15,000 is the norm (33,241 SHGs). Shows why RF totals track RF-receiving SHG counts.
- question: Top 10 SHGs by CIF
  sql: |
    SELECT shg_code, shg_name, lgd_district, lgd_block, cif_amount
    FROM curated.v_nrlm
    ORDER BY cif_amount DESC
    LIMIT 10;
  tables:
  - curated.v_nrlm
  note: All ten exceed Rs 5 lakh and are unconfirmed by the client (NR-25). Carry the caveat.
- question: CIF held by SHGs of each type
  sql: |
    SELECT shg_type,
           COUNT(*) AS shgs,
           ROUND(SUM(cif_amount) / 1e7, 2) AS cif_cr,
           ROUND(AVG(cif_amount) FILTER (WHERE cif_amount > 0), 0) AS avg_cif_among_recipients
    FROM curated.v_nrlm
    GROUP BY shg_type
    ORDER BY cif_cr DESC;
  tables:
  - curated.v_nrlm
- question: Funds held by SHGs formed in 2017-18
  sql: |
    SELECT COUNT(*) AS shgs,
           ROUND(SUM(revolving_fund_amount) / 1e7, 2) AS rf_held_cr,
           ROUND(SUM(cif_amount) / 1e7, 2)            AS cif_held_cr
    FROM curated.v_nrlm
    WHERE formation_financial_year_short = '2017-18';
  tables:
  - curated.v_nrlm
  note: >
    Allowed ONLY because it asks what a FORMATION COHORT holds today. The answer must say
    "held to date by SHGs formed in 2017-18", never "released in 2017-18". If the user's
    words were "released in 2017-18", the gate refuses first.
- question: Total funds by block in South West Khasi Hills
  sql: |
    SELECT lgd_block,
           ROUND(SUM(revolving_fund_amount) / 1e5, 2) AS rf_lakh,
           ROUND(SUM(cif_amount) / 1e5, 2)            AS cif_lakh
    FROM curated.v_nrlm
    WHERE lgd_district = 'SOUTH WEST KHASI HILLS'
    GROUP BY lgd_block
    ORDER BY cif_lakh DESC;
  tables:
  - curated.v_nrlm
  note: Block totals fall below one crore, so lakh is the default unit.

# ---- villages ---------------------------------------------------------------
- question: How many villages have an SHG?
  sql: |
    SELECT COUNT(DISTINCT village_code) AS villages
    FROM curated.v_nrlm
    WHERE entity_type <> 'Unresolved';
  tables:
  - curated.v_nrlm
  expected: 4976
- question: How many SHGs have no village recorded?
  sql: |
    SELECT lgd_district, COUNT(*) AS shgs_without_village
    FROM curated.v_nrlm
    WHERE entity_type = 'Unresolved'
    GROUP BY lgd_district
    ORDER BY shgs_without_village DESC;
  tables:
  - curated.v_nrlm
  expected_total: 2032
- question: Villages with the most SHGs
  sql: |
    SELECT village_code, lgd_village_name, lgd_block, COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE entity_type <> 'Unresolved'
    GROUP BY village_code, lgd_village_name, lgd_block
    ORDER BY shgs DESC
    LIMIT 5;
  tables:
  - curated.v_nrlm
  note: Grouped by code with name and block for display - 197 names are shared. Barato (Laskein, 104) leads.
- question: Villages per block in Ri Bhoi
  sql: |
    SELECT lgd_block,
           COUNT(DISTINCT village_code) FILTER (WHERE entity_type <> 'Unresolved') AS villages,
           COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE lgd_district = 'RI BHOI'
    GROUP BY lgd_block
    ORDER BY villages DESC;
  tables:
  - curated.v_nrlm
  note: SHG count keeps the Unresolved rows; village count drops them. Both in one query.
- question: SHGs in Nongbah village, Thadlaskein block
  sql: |
    SELECT shg_code, shg_name, shg_type, is_active, total_members,
           revolving_fund_amount, cif_amount
    FROM curated.v_nrlm
    WHERE village_code = 279159
    ORDER BY shg_name
    LIMIT 100;
  tables:
  - curated.v_nrlm
  note: Nongbah exists in two blocks; the resolver returned code 279159 once the block was given.

# ---- constituency and GP ------------------------------------------------------
- question: How many SHGs are in Mawkyrwat constituency?
  sql: |
    SELECT COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE constituency_name_raw = 'Mawkyrwat';
  tables:
  - curated.v_nrlm
  expected: 1092
- question: SHGs in constituency number 23
  sql: |
    SELECT constituency_name_raw, constituency_number_raw, COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE constituency_number_raw LIKE '23 %'
    GROUP BY constituency_name_raw, constituency_number_raw;
  tables:
  - curated.v_nrlm
  expected: {constituency_name_raw: Sohing, constituency_number_raw: 23 SOHIONG, shgs: 837}
  note: The trailing space in '23 %' stops '2' or '3' matching wider numbers.
- question: SHGs and members by constituency
  sql: |
    SELECT constituency_number_raw, COUNT(*) AS shgs, SUM(total_members) AS members
    FROM curated.v_nrlm
    WHERE constituency_name_raw IS NOT NULL
    GROUP BY constituency_number_raw
    ORDER BY shgs DESC
    LIMIT 10;
  tables:
  - curated.v_nrlm
  note: 2,032 SHGs have no constituency; the breakdown sums to 38,597. State it.
- question: How many SHGs are in Barato GP?
  sql: |
    SELECT lgd_block, COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE gp_name ILIKE 'Barato'
    GROUP BY lgd_block;
  tables:
  - curated.v_nrlm
  note: GP is free text and may repeat across blocks - group by block so a split is visible.

# ---- single SHG and name lookups --------------------------------------------------
- question: Show details of SHG 3329
  sql: |
    SELECT shg_code, shg_name, shg_type, is_active, formation_financial_year_short,
           lgd_district, lgd_block, lgd_village_name, gp_name,
           male_members, female_members, total_members,
           revolving_fund_amount, cif_amount
    FROM curated.v_nrlm
    WHERE shg_code = 3329;
  tables:
  - curated.v_nrlm
  expected_rows: 1
- question: Find SHGs named Kyrshanlang
  sql: |
    SELECT shg_code, shg_name, lgd_district, lgd_block, lgd_village_name, is_active
    FROM curated.v_nrlm
    WHERE shg_name ILIKE 'Kyrshanlang%'
    ORDER BY lgd_district, lgd_block, lgd_village_name
    LIMIT 100;
  tables:
  - curated.v_nrlm
  note: Names are not unique. Return the list with codes and places; never assume one.
- question: How many SHGs share the name Iatreilang Shg?
  sql: |
    SELECT lgd_district, COUNT(*) AS shgs
    FROM curated.v_nrlm
    WHERE shg_name = 'Iatreilang Shg'
    GROUP BY lgd_district
    ORDER BY shgs DESC;
  tables:
  - curated.v_nrlm
  expected_total: 295
- question: List SHGs in Laskein block formed in 2021-22
  sql: |
    SELECT shg_code, shg_name, shg_type, is_active, lgd_village_name, total_members,
           revolving_fund_amount, cif_amount
    FROM curated.v_nrlm
    WHERE lgd_block = 'LASKEIN'
      AND formation_financial_year_short = '2021-22'
    ORDER BY lgd_village_name, shg_name
    LIMIT 100;
  tables:
  - curated.v_nrlm

# ---- data quality -----------------------------------------------------------------
- question: Which SHGs look like duplicate registrations?
  sql: |
    SELECT shg_code, shg_name, lgd_village_name, lgd_block, lgd_district,
           formation_financial_year_short, total_members
    FROM curated.v_nrlm
    WHERE is_possible_duplicate
    ORDER BY shg_name, shg_code;
  tables:
  - curated.v_nrlm
  expected_rows: 10
  note: 5 pairs, unconfirmed (NR-24). Both rows of each pair are real until the client says otherwise.
- question: Which SHGs have a district name that disagrees with the LGD code?
  sql: |
    SELECT f.shg_code, f.district_name_raw, f.block_name_raw,
           f.district_lgd_code, f.block_lgd_code
    FROM curated.fact_nrlm_shg f
    WHERE f.has_name_code_conflict
    ORDER BY f.shg_code;
  tables:
  - curated.fact_nrlm_shg
  expected_rows: 12
  note: Lineage question - the source names live on the fact only. The view exposes the corrected geography.

# ---- cross-scheme, aggregated separately ----------------------------------------------
- question: Villages with both SHGs and PMAY houses
  sql: |
    WITH n AS (
      SELECT village_code, COUNT(*) AS shgs
      FROM curated.v_nrlm
      WHERE entity_type <> 'Unresolved'
      GROUP BY village_code
    ), p AS (
      SELECT village_code, COUNT(*) AS pmay_houses
      FROM curated.v_pmay
      WHERE NOT is_placeholder
      GROUP BY village_code
    )
    SELECT COUNT(*) FILTER (WHERE n.village_code IS NOT NULL AND p.village_code IS NOT NULL) AS both_schemes,
           COUNT(*) FILTER (WHERE p.village_code IS NULL)                                AS nrlm_only,
           COUNT(*) FILTER (WHERE n.village_code IS NULL)                                AS pmay_only
    FROM n
    FULL JOIN p ON p.village_code = n.village_code;
  tables:
  - curated.v_nrlm
  - curated.v_pmay
  note: >
    Each scheme aggregated to village_code FIRST, then the aggregates joined - never the
    rows. PMAY's mandatory NOT is_placeholder still applies inside its own CTE.
- question: SHGs and MGNREGA person-days by district
  sql: |
    WITH n AS (
      SELECT lgd_district, COUNT(*) AS shgs, SUM(total_members) AS shg_members
      FROM curated.v_nrlm
      GROUP BY lgd_district
    ), m AS (
      SELECT lgd_district, SUM(person_days) AS person_days
      FROM curated.v_employment
      WHERE financial_year_short = '2024-25'
      GROUP BY lgd_district
    )
    SELECT COALESCE(n.lgd_district, m.lgd_district) AS lgd_district,
           n.shgs, n.shg_members, m.person_days
    FROM n
    FULL JOIN m ON m.lgd_district = n.lgd_district
    ORDER BY lgd_district;
  tables:
  - curated.v_nrlm
  - curated.v_employment
  note: >
    The NRLM side is a current snapshot with no year; the MGNREGA side is one financial
    year. Say so - they are side by side, not like for like.

