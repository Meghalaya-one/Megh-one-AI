resolver_version: '1.0'
resolver_name: nrlm_entity_resolver
display_name: NRLM Self Help Group Entity Resolver (Meghalaya) - curated star schema
generated_from:
- datasets/NRLM/NRLM.csv
- datasets/NRLM/NRLM_Data_Readiness_Document.pdf
- SCHEMA_FOR_DEVELOPERS.md (live database extract, 2026-10-05 11:24 UTC)
generated_on: '2026-10-05'
companion_schema: nrlm_schema_partitions.yaml

# ===========================================================================
# v1.0 - 2026-10-05 - FIRST VERSION, WRITTEN AGAINST THE CURATED VIEW
#
# Target: curated.v_nrlm over curated.fact_nrlm_shg.
#
# Source column -> stored column:
#   mapped_district_lgd_name -> lgd_district        STORED UPPERCASE
#   mapped_district_lgd_code -> district_lgd_code   KEPT - authoritative
#   mapped_block_lgd_name    -> lgd_block           STORED UPPERCASE
#   mapped_block_lgd_code    -> block_lgd_code      KEPT - authoritative
#   mapped_village_lgd_name  -> lgd_village_name
#   mapped_village_lgd_code  -> village_code        (Unresolved placeholder when blank)
#   mapped_constituency_name -> constituency_name_raw              mixed case
#   mapped_constituency_name_and_number -> constituency_number_raw '<n> <NAME>'
#   active_sta               -> is_active           boolean
#   rf_amount                -> revolving_fund_amount
#   financial_year           -> formation_financial_year(_short)   FORMATION YEAR
#   group_form               -> DROPPED AT INGEST. '00:00.0' on every row.
#
# The catalogues for district, block, constituency and the village ambiguity
# registry were GENERATED from NRLM.csv by a script, grouped by LGD CODE (as the
# database stores them), on 2026-10-05. All counts are source-file figures and
# have NOT been re-verified against megh_db.
# ===========================================================================

description: >
  Value-level entity resolution for the NRLM NLP-to-SQL bot. This file answers exactly
  one question: the user typed some text - which stored database value did they mean?
  It does NOT define column meanings or aggregation; that is the companion stage2
  semantic schema. Resolve entities with this file FIRST, then hand the resolved
  canonical values to schema linking and SQL generation.

scheme:
  id: nrlm
  display_name: NRLM
  full_name: National Rural Livelihoods Mission (Deendayal Antyodaya Yojana - NRLM)
  state: Meghalaya
  implementing_agency: Meghalaya State Rural Livelihoods Society (MSRLS), Community and Rural Development Department
  aliases: [NRLM, "DAY-NRLM", "DAY NRLM", DAYNRLM, "Aajeevika", "Ajeevika", "National Rural Livelihoods Mission",
            "National Rural Livelihood Mission", "Deendayal Antyodaya Yojana", MSRLS, SRLM,
            "Meghalaya State Rural Livelihoods Society", "State Rural Livelihoods Mission",
            "SHG scheme", "self help group scheme", "livelihood mission", "rural livelihoods"]
  alias_note: >
    "SGSY" (the predecessor scheme) and "NULM" / "DAY-NULM" (the URBAN mission) are NOT
    aliases. SGSY-era groups appear as shg_type 'Pre-Nrlm' at most; NULM is not held -
    see nrlm_classification_rules.yaml urban_livelihoods_requested.

tables:
  shgs: curated.v_nrlm                       # primary query surface, 29 columns
  fact: curated.fact_nrlm_shg                # underlying fact, 30 columns, lineage only
  reconciliation: meta.v_reconciliation_nrlm # operator check, not readable by megh_readonly

dataset_shape:
  grain: one row per Self Help Group (shg_code), as at the extract date
  row_count: unverified_in_db
  row_count_note: The source file holds 40629 rows. The curated count is unmeasured from this machine.
  single_table: true
  snapshot: true
  emits_no_joins: >
    curated.v_nrlm already pre-joins dim_geography and dim_year (as formation year) and
    computes total_members, so the generator emits WHERE and GROUP BY only. See
    nrlm_foreign_key_augmentation.yaml.

# ---------------------------------------------------------------------------
# HOW TO USE THIS FILE
# ---------------------------------------------------------------------------
how_to_use:
  step_1_classify: >
    Decide the entity type of each span of user text. Order matters because block,
    village and constituency names collide - see cross_dimension_collisions. Try:
    formation_year -> shg_code -> district -> block -> constituency -> village ->
    gp_name -> shg_type -> shg_status -> shg_name -> measure.
  step_2_normalise: Apply normalisation.fold to the user text and to candidate values.
  step_3_match: Walk matching_pipeline in order; stop at the first stage that hits.
  step_4_emit: Return an output_contract shape. Never put raw user text into SQL.
  step_5_predicate: Build WHERE using the dimension's sql_predicate template.

  hard_rules:
  - "CASE RULE. lgd_district and lgd_block are stored UPPERCASE in dim_geography.
    lgd_village_name is Title Case. constituency_name_raw is mixed case as typed.
    shg_type is 'New' / 'Revived' / 'Pre-Nrlm'. Always compare case-folded, and emit the
    form the column actually stores."
  - "CODES ARE AUTHORITATIVE. district_lgd_code and block_lgd_code exist on every row and
    win over any name. A user-supplied LGD code goes straight into the predicate."
  - Villages are resolved by village_code, never by name alone. 197 village names are
    shared by two or more different villages.
  - "SHGs are resolved by shg_code, never by name alone. shg_name is NOT unique - 27,692
    names for 40,629 SHGs. A name hit on more than one SHG is ambiguous; list and ask."
  - "The ONLY year is the FORMATION year. A year in a money question is not resolved
    to formation_financial_year - it is handed to the gate (money_in_a_year_requested)."
  - "Unresolved SHGs (entity_type = 'Unresolved', 2,032) are in every district and block
    total and in no village answer."
  - "gp_name is advisory free text. Resolve to it only when the user says GP, gram
    panchayat, panchayat or village council. Otherwise a place name is a village."
  - "Member names, member-level rows, savings, loans and federations do not exist. A
    lookup for any of them returns not-held, never a guess."
  - If more than one candidate survives, return ambiguous and ask. Never pick the first row.
  - If nothing matches above the fuzzy floor, return not_found with suggestions. Never
    invent a district, block, village, constituency, SHG or type.

# ---------------------------------------------------------------------------
normalisation:
  fold:
  - trim and collapse internal whitespace to single spaces
  - uppercase
  - strip trailing qualifier words: BLOCK, C&RD BLOCK, DISTRICT, VILLAGE, CONSTITUENCY, AC, GP, SHG
  - map & to AND
  - treat - / ( ) and . as a single space, then re-collapse whitespace
  squash: remove every non-alphanumeric character from the folded form
  numeric_ids: >
    shg_code, village_code, district_lgd_code and block_lgd_code are integers. Cast
    user-typed codes with int() and strip any trailing .0 before comparing.
  shg_name_fold: >
    For SHG names additionally strip the trailing words SHG, S.H.G., SELF HELP GROUP,
    MSRLS, NRLM before the fuzzy stage - 30,434 names carry 'Shg' and many carry a village
    suffix ('Kyrshanlang Shg Nangbah'). Never strip them before the exact stage.

matching_pipeline:
- { stage: 1_exact,     test: folded user text == folded canonical, confidence: 1.0 }
- { stage: 2_alias,     test: folded user text in the value's aliases, confidence: 0.98 }
- { stage: 3_squash,    test: squashed user text == squashed canonical or alias, confidence: 0.95 }
- { stage: 4_acronym,   test: district acronym table only, confidence: 0.95,
    note: acronyms are defined for districts only - do not invent them for blocks }
- stage: 5_contains
  test: folded canonical is a whole-word substring of the user text or vice versa
  confidence: 0.85
- stage: 6_fuzzy
  test: RapidFuzz token_set_ratio over the dimension catalogue
  accept_at: ">= 90 and runner-up at least 5 points lower"
  ask_between: 80 - 89, or any score where the runner-up is within 5 points
  reject_below: 80
- stage: 7_embedding
  test: BGE-small nearest neighbour over the dimension catalogue
  use_when: fuzzy returned nothing at or above 80
  accept_at: cosine >= 0.88 AND unique within its dimension
- { stage: 8_fail, action: emit not_found with up to 5 suggestions }

blocked_matches:
  purpose: >
    Pairs fuzzy matching gets wrong. Never let stage 6 or 7 resolve the left value to the
    right one; require an exact or alias hit.
  pairs:
  - [Laskein, Thadlaskein]                       # two different West Jaintia Hills blocks
  - [Thadlaskein, Laskein]
  - [Mawkynrew, Mawkyrwat]                       # East Khasi Hills vs South West Khasi Hills
  - [Mawkyrwat, Mawkynrew]
  - [Mawsynram, Mawshynrut]                      # East Khasi Hills vs West Khasi Hills
  - [Mawshynrut, Mawsynram]
  - [Siju, Saipung]
  - [West Khasi Hills, Eastern West Khasi Hills] # two districts, 279 vs 740
  - [Eastern West Khasi Hills, West Khasi Hills]
  - [West Garo Hills, South West Garo Hills]     # 278 vs 663 - the source confuses them
  - [South West Garo Hills, West Garo Hills]
  - [West Khasi Hills, South West Khasi Hills]   # 279 vs 658
  - [Mawphlang, Mawpat]
  - [Mawlai, Mawhati]
  - [Rongram, Rongara]
  - [New, Revived]
  - [Iatreilang Shg, Iatyllilang Shg]            # the two most common SHG names, 295 and 204 SHGs

output_contract:
  resolved:
    status: resolved
    entity_type: district | block | village | constituency | gp_name | shg_type |
                 shg_status | shg_code | shg_name | formation_year | measure
    user_text: <verbatim span>
    canonical: <exact stored value>
    lgd_code: <code, geography only>
    confidence: <0-1>
    matched_by: <pipeline stage>
  ambiguous:
    status: ambiguous
    entity_type: <type>
    user_text: <verbatim span>
    candidates: [ { canonical, lgd_code / shg_code, district, block } ]
    question: <one short question naming the distinguishing attribute>
  not_found:
    status: not_found
    entity_type: <type or unknown>
    user_text: <verbatim span>
    suggestions: [ up to 5 nearest catalogue values ]
    message: state plainly that the value is not in the NRLM data.

# ---------------------------------------------------------------------------
overloaded_terms:
  why: >
    A handful of words map to more than one column in this dataset. Getting these wrong
    produces a confidently wrong answer, so they are listed explicitly.

  beneficiaries:
    readings:
    - { means: "COUNT(*) - SHGs", when: "the user is asking about groups" }
    - { means: "SUM(total_members) - members", when: "the user is asking about people, women or households" }
    default: ask (nrlm_classification_rules.yaml beneficiaries_ambiguous).
    note: NRLM has no beneficiary row. 40,629 SHGs vs 410,847 members - a 10x difference.

  members:
    means: SUM(total_members)
    never: COUNT(*)
    note: '"members" is a column sum. COUNT(*) counts groups.'

  women:
    readings:
    - { means: "SUM(female_members)", when: "women members, women mobilised, how many women" }
    - { means: "COUNT(*) WHERE male_members = 0", when: "all-women SHGs, women-only groups" }
    default: SUM(female_members). Say that 39,924 of 40,629 SHGs are all-women.

  new:
    readings:
    - { means: "shg_type = 'New'", when: "new SHGs as a TYPE, new vs revived" }
    - { means: "formation_financial_year_short = '<latest>'", when: "recently formed, newly formed this year" }
    default: ask (new_shg_word_unclear) unless 'type' or 'revived' is in the question.

  pre_nrlm:
    readings:
    - { means: "shg_type = 'Pre-Nrlm'", when: "the user names the type" }
    - { means: "formation_financial_year_short < '2011-12'", when: "formed before NRLM / before 2011" }
    default: ask (pre_nrlm_type_vs_year). 432 typed vs 645 formed before 2011-12.

  fund:
    readings:
    - { means: SUM(revolving_fund_amount), when: "RF, revolving fund" }
    - { means: SUM(cif_amount), when: "CIF, community investment fund, investment fund" }
    - { means: "both, side by side", when: "fund / funds / money / amount with no qualifier" }
    default: ask, or show both - never silently pick one.

  released_received_disbursed:
    means: the cumulative amount held as at the extract
    critical: true
    note: >
      'Released', 'disbursed', 'given', 'received', 'sanctioned' all resolve to the same
      cumulative column. None of them carries a date. "Released IN <year>" is a gate
      refusal, not a formation-year filter.

  year:
    means: formation_financial_year_short
    critical: true
    note: >
      Every year the user types resolves to the FORMATION year - and is valid only for
      SHG count, member and formation questions. With money it goes to the gate.

  active:
    readings:
    - { means: "is_active", when: "active, functional, working, live, operational" }
    - { means: "NOT is_active", when: "inactive, dormant, defunct, non-functional, closed, dissolved" }
    note: is_active is NOT NULL, so NOT is_active is the exact complement.

  gp:
    means: gp_name
    note: >
      Only when the user says GP, gram panchayat, panchayat, village council or dorbar.
      gp_name is free text outside LGD; prefer village or block and say why.

# ---------------------------------------------------------------------------
cross_dimension_collisions:
  measured:
    block_names_that_are_also_village_names: 25
    block_names_that_are_also_constituency_names: 26
    constituency_names_that_are_also_village_names: 25
    block_names_that_are_also_gp_names: 22
    district_collisions: 0
  block_village_collisions: [Adokgre, Amlarem, Baghmara, Batabari, Demdema, Gambegre, Laskein,
    Lumshnong, Mawhati, Mawkynrew, Mawkyrwat, Mawlai, Mawpat, Mawryngkneng, Mawshynrut,
    Nongstoin, Pynursla, Rambrai, Ranikor, Rerapara, Saipung, Songsak, Umling, Umsning, Zikzak]
  block_constituency_collisions: [Amlarem, Baghmara, Bajengdoba, Chokpot, Dalu, Gambegre, Jirang,
    Kharkutta, Mairang, Mawhati, Mawkynrew, Mawkyrwat, Mawlai, Mawphlang, Mawryngkneng,
    Mawshynrut, Mawsynram, Mawthadraishan, Mylliem, Nongstoin, Pynursla, Ranikor,
    Resubelpara, Selsella, Songsak, Umsning]
  constituency_only_names_that_look_like_blocks: [Sutnga-saipung, Rambrai jyrngam, Rongara-siju,
    Shella, Sohing, Dadenggre, Tikrikila]
  disambiguation_rules:
  - If the user said "block" or "C&RD block", resolve as block.
  - If the user said "constituency", "AC", "MLA" or "assembly", resolve as constituency.
  - If the user said "village" or "gaon", resolve as village.
  - If the user said "GP", "panchayat" or "village council", resolve as gp_name.
  - With no qualifier, default to BLOCK - it is the administrative level users mean.
  - "A block and its same-name constituency cover DIFFERENT areas (e.g. Mawkyrwat block
    1,106 SHGs vs Mawkyrwat constituency 1,092). Never treat them as the same filter."
  - State the assumption in the answer whenever the default fired on a colliding name.
  - Districts never collide with anything; resolve them with no qualifier needed.

