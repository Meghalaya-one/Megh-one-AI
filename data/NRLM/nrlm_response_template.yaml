# nrlm_response_template.yaml
#
# ===========================================================================
# v1.0 - 2026-10-05 - FIRST VERSION, WRITTEN AGAINST THE CURATED STAR SCHEMA
#
# This file shapes wording, not SQL. Three caveats are what make NRLM answers
# safe, and they must travel with the numbers:
#
#   1. GRAIN. One row is one Self Help Group. A count is SHGs; members are a sum.
#      Never call an SHG count "beneficiaries" or "people".
#   2. MONEY IS CUMULATIVE AND UNDATED. Every money figure says "received to date"
#      and "as at the current extract". Never "released in <year>".
#   3. THE YEAR IS THE FORMATION YEAR. Every year-based figure says "formed in".
#
# Geography display case: dim_geography stores district and block UPPERCASE, so
# the composer title-cases them for display rather than passing them through.
# ===========================================================================
#
# Response templates for NRLM - node 5.15, the response composer.
# Editable by analysts - no code change needed.
# Numbers are locked from the result set; templates only shape the wording around them.

response_templates:

  # ---- how the answer text is shaped ------------------------------------
  formatting:
    number_format: "indian"            # 4,10,847 not 410,847
    currency_symbol: "₹"
    decimal_places: 2
    percent_decimal_places: 2
    financial_year_format: "YYYY-YY"   # 2020-21; the FORMATION year
    money_unit: "crore"                # v_nrlm stores RUPEES, reported in crore for totals
    row_level_money_unit: "rupees"     # a single SHG's RF is ₹15,000, never 0.0015 crore
    sub_crore_money_unit: "lakh"       # block and village totals usually fall below a crore
    money_unit_warning: >
      curated.v_nrlm is RUPEES (assumed - NR-07). MGNREGA expenditure is LAKH; PMAY is
      rupees; the cross-scheme money view is crore. Never add across them, and state the
      unit on every figure.
    money_is_cumulative: true
    show_unit_always: true
    show_assumptions: true             # surface the defaults that fired
    geography_display_case: "title"    # filter with the uppercase literal, display title case
    constituency_display: "name_and_number"   # "Mawkyrwat (36)"
    shg_type_display:                  # stored -> displayed
      New: "New"
      Revived: "Revived"
      Pre-Nrlm: "Pre-NRLM"
    status_display: { true: "Active", false: "Inactive" }
    null_display: "not recorded"
    zero_display: "0"                  # a recorded zero fund is a real value, not a blank
    tie_behaviour: "show_all"
    empty_result_message: "No SHGs on the register for that selection."
    max_rows_inline: 20

  # =======================================================================
  templates:

    # ---- result shapes --------------------------------------------------
    single_value: "{metric} for {scope} is {value}."
    multi_metric: "For {scope}: {metric_list}."
    shg_count: "{scope} has {value} SHGs on the register."
    shg_count_with_status: "{scope} has {value} SHGs - {active} active and {inactive} inactive."
    member_count: "SHGs in {scope} have {value} members - {women} women and {men} men."
    formation_count: "{value} SHGs in {scope} were formed in {formation_year}."
    formation_range_count: "{value} SHGs in {scope} were formed between {start} and {end}."
    fund_total: "SHGs in {scope} have received {value} in {fund} to date."
    fund_pair: "SHGs in {scope} have received {rf} in Revolving Fund and {cif} in Community Investment Fund to date."
    fund_coverage: "{covered} of {total} SHGs in {scope} ({value}%) have received {fund}."
    average_value: "Average {metric} per {denominator} for {scope} is {value}."
    average_fund_two_populations: "Across all SHGs in {scope} the average {fund} is {avg_all}; among the {recipients} SHGs that received it, {avg_recipients}."
    share_percentage: "{metric} for {scope} is {value}%."
    proportion_of_total: "{scope} accounts for {value}% of the State total for {metric}."
    active_rate: "{active} of {total} SHGs in {scope} are active, {value}%."

    ranked_list: "Top {n} {entity} by {metric}:"
    bottom_list: "Bottom {n} {entity} by {metric}:"
    extremes: "Highest is {top_entity} at {top_value}; lowest is {bottom_entity} at {bottom_value}."
    rank_position: "{scope} ranks {rank} of {total} {entity} by {metric}."
    tie_at_top: "{tied_entities} are level at {value}."

    breakdown: "{metric} by {level}:"
    type_breakdown: "SHGs in {scope} by type, Pre-NRLM, Revived, New:"
    status_breakdown: "SHGs in {scope} by status:"
    formation_series: "SHGs formed each year in {scope}, {start} to {end}:"
    formation_cohort_comparison: "{value_a} SHGs were formed in {period_a} against {value_b} in {period_b} - a difference of {change}."
    comparison: "{entity_a} {value_a} against {entity_b} {value_b} - a difference of {change}."
    cohort_fund_holding: "SHGs formed in {formation_year} hold {value} in {fund} today. This is what that group of SHGs has received to date, not what was released in {formation_year}."

    shg_detail: "SHG {shg_code}, {shg_name}, is a {shg_type} group formed in {formation_year}, in {village} village, {block} block, {district} district. It is {status}, with {members} members ({women} women), and has received {rf} Revolving Fund and {cif} CIF to date."
    shg_detail_no_village: "SHG {shg_code}, {shg_name}, is in {block} block, {district} district; its village is not recorded."
    shg_name_matches: "{count} SHGs are called '{value}'. Give me the SHG code, or the block or village, to pick one:"
    lookup_list: "Matches for '{value}':"
    entity_list: "{entity} in {scope}:"
    year_list: "Formation years in the data: {first} to {last}."
    coverage_statement: "{value} villages in {scope} have at least one SHG."

    # ---- situations that need specific wording ---------------------------
    empty_result: "No SHGs on the register match {scope}."
    all_zero_result: "SHGs in {scope} have received zero {fund}. The zero is a recorded value, not missing data."
    unavailable_in_source: "{requested} is not held in this data."
    money_in_year_refused: "Fund amounts are cumulative totals each SHG has received, with no release date, so they cannot be split by year. I can show what SHGs formed in {year} hold today, clearly labelled as that."
    money_trend_refused: "The data is a single snapshot with no release dates, so a trend or growth in funds cannot be calculated. Current totals by district, or SHG formation by year, are available."
    federation_not_held: "Village Organisations and Cluster Level Federations are not held - there is no federation identifier in this data."
    savings_not_held: "Savings, bank linkage and loans are not held. The only money recorded is the Revolving Fund and Community Investment Fund each SHG has received."
    members_not_held: "Individual members are not held - only the number of male and female members in each SHG."
    formation_date_not_held: "Only the financial year of formation is recorded; the formation date arrived empty in the source."
    entity_not_found: "'{value}' is not in the NRLM data. Closest matches: {suggestions}."
    ambiguous_entity_resolved: "Read '{value}' as {resolved} in {district}. There are {count} places with that name."
    colliding_name_resolved: "Read '{value}' as a block. It is also the name of a {other_level} - say '{other_level} {value}' for that reading."
    constituency_vs_block_note: "{value} block and {value} constituency cover different areas: {block_value} SHGs in the block, {constituency_value} in the constituency."
    outside_data_span: "No SHG formed in {period} is on the register. Formation years run from 1984-85 to 2022-23."
    latest_year_note: "The latest formation year held is 2022-23; nothing later is in this extract."
    permission_denied: "That level of detail is above your access. The finest level available to you is {allowed_level}."
    execution_failed: "The query could not be completed. Please try a smaller area."

    # ---- lines that travel alongside the answer --------------------------
    unit_statement: "Amounts are in {unit} rupees."
    unit_unconfirmed_note: "Amounts are taken to be rupees; MSRLS has not yet confirmed the unit."
    cumulative_money_note: "Amounts are cumulative - what each SHG has received to date, as at the current data extract - not releases in any one year."
    snapshot_note: "Figures describe the SHG register as at the current extract."
    assumption_prefix: "Assumed: {assumptions}."
    shg_grain_note: "One row is one Self Help Group, so this is a count of groups, not of people."
    members_vs_shgs_note: "SHGs are groups; members are the people in them. {shgs} SHGs have {members} members."
    formation_year_note: "The year shown is the year each SHG was formed - the only year in this data."
    women_share_note: "{women_pct}% of SHG members are women; {all_women_shgs} of {shgs} SHGs have no male member."
    unresolved_village_note: "{excluded} SHGs have no village recorded; they are counted in block and district totals but not in village figures."
    constituency_coverage_note: "Constituency is not recorded for {excluded} SHGs, so these figures add up to {covered}, not the State total of {total}."
    gp_caveat_note: "GP names are as typed in the source, without codes, and are not part of the official district-block-village hierarchy."
    district_by_code_note: "Districts follow the LGD code. 12 SHGs named 'Eastern West Khasi Hills' in the source file are counted under East Jaintia Hills, their LGD district."
    ewkh_distinct_note: "Eastern West Khasi Hills and West Khasi Hills are separate districts."
    rf_norm_note: "The usual Revolving Fund is ₹15,000 per SHG; {rf_30k} SHGs hold ₹30,000, likely two rounds."
    rf_ranking_note: "Most SHGs hold the same ₹15,000 Revolving Fund, so a ranking by RF closely follows the number of SHGs that received it."
    cif_zero_share_note: "{zero_pct}% of SHGs hold no CIF, which pulls an all-SHG average down."
    high_cif_note: "{count} SHGs hold more than ₹5 lakh CIF (up to ₹13.6 lakh); these values are not yet confirmed by MSRLS."
    inactive_zero_fund_note: "All inactive SHGs show zero RF and CIF in the source; the reason is not recorded."
    duplicate_registration_note: "{pairs} pairs of SHGs look like double registrations (identical except for their code); both are counted until MSRLS confirms."
    out_of_norm_note: "{count} SHGs have membership outside the NRLM norm of 10 to 20 members, including {zero} with no members recorded."
    pre_nrlm_note: "'Pre-NRLM' here is the SHG type ({typed} SHGs), not the formation year - {formed_before} SHGs were formed before 2011-12."
    village_identity_note: "Villages are counted by LGD code, since 197 village names are shared by more than one village."
    shg_name_identity_note: "SHG names repeat - {count} SHGs share this one - so SHGs are identified by code."
    region_expansion_note: "{region} covers {districts}."
    cross_scheme_caveat: "NRLM figures are the current SHG register, while {other_scheme} figures are for {period} - they sit side by side but are not like for like."
    cross_scheme_money_caveat: "NRLM funds are cumulative amounts held by SHGs with no year; {other_scheme} money is {other_semantics}. The two are not comparable as spending."
    threshold_breach: "{scope} is below {threshold} at {value}."
    threshold_pass: "{scope} is at or above {threshold} at {value}."
    outlier_note: "{entity} is well clear of the rest and pulls the average up."
    large_result: "Showing the first {shown} of {total} rows."

  # =======================================================================
  follow_up_rules:

    # ---- move up or down the hierarchy ----------------------------------
    - condition: "result_is_statewide"
      suggestion: "Split this by district?"

    - condition: "result_by_district"
      suggestion: "Break this down by block?"

    - condition: "result_by_block"
      suggestion: "Break this down by village?"

    - condition: "result_is_single_village"
      suggestion: "List the SHGs in this village?"

    - condition: "result_is_single_district"
      suggestion: "See how this compares with the other districts?"

    - condition: "result_is_region"
      suggestion: "See the districts inside that region separately?"

    - condition: "result_by_constituency"
      suggestion: "See the same figures by block instead?"

    # ---- move across formation cohorts ------------------------------------
    - condition: "result_is_single_value"
      suggestion: "See when these SHGs were formed, year by year?"

    - condition: "result_has_single_formation_year"
      suggestion: "Compare with SHGs formed the year before?"

    - condition: "result_is_formation_series"
      suggestion: "See which districts formed the most SHGs?"

    # ---- move across measures -------------------------------------------
    - condition: "result_is_shg_count"
      suggestion: "See how many members these SHGs have?"

    - condition: "result_is_member_count"
      suggestion: "See the average members per SHG?"

    - condition: "result_is_shg_count_all_status"
      suggestion: "See how many of them are inactive?"

    - condition: "result_is_inactive_count"
      suggestion: "See which districts have the most inactive SHGs?"

    - condition: "result_is_rf_total"
      suggestion: "See the Community Investment Fund for the same area?"

    - condition: "result_is_cif_total"
      suggestion: "See how many SHGs have received CIF at all?"

    - condition: "result_is_fund_coverage"
      suggestion: "See the active SHGs that have not yet received it?"

    - condition: "result_is_type_breakdown"
      suggestion: "See the funds held by each SHG type?"

    - condition: "result_is_village_count"
      suggestion: "See the villages with the most SHGs?"

    # ---- after a refusal ------------------------------------------------
    - condition: "money_in_year_refused"
      suggestion: "See what SHGs formed in that year hold today?"

    - condition: "money_trend_refused"
      suggestion: "See current fund totals by district?"

    - condition: "savings_or_federation_refused"
      suggestion: "See Revolving Fund and CIF received instead?"

    # ---- cross-scheme -----------------------------------------------------
    - condition: "result_is_village_list"
      suggestion: "See which of these villages also have PMAY houses?"

    - condition: "result_is_district_shg_count"
      suggestion: "See these districts' SHG members beside MGNREGA households employed?"

    # ---- work with the list just returned --------------------------------
    - condition: "result_is_ranked_list"
      suggestion: "Would you like to see the lowest as well?"

    - condition: "result_is_ranked_list_top_n"
      suggestion: "See what share of the State total these account for?"

    - condition: "result_has_tie"
      suggestion: "Break the tie on a second measure?"

    - condition: "result_has_outlier"
      suggestion: "See the figures with that entry set aside?"

    - condition: "result_row_count_exceeds_display"
      suggestion: "Export the full list?"

    - condition: "result_is_shg_listing"
      suggestion: "Summarise these SHGs by type and status instead?"

    - condition: "result_is_shg_name_list"
      suggestion: "Give the SHG code to see one group's details?"

    # ---- recover from a thin or failed answer ----------------------------
    - condition: "result_is_empty"
      suggestion: "Try the block this village sits in?"

    - condition: "result_is_all_zero"
      suggestion: "Check whether these SHGs are inactive?"

    - condition: "entity_not_found"
      suggestion: "List the blocks in that district instead?"

    - condition: "entity_resolved_by_assumption"
      suggestion: "Did you mean the village or constituency of that name rather than the block?"

    - condition: "measure_unavailable_in_source"
      suggestion: "See what is recorded for that area instead?"

    - condition: "result_excludes_unresolved_villages"
      suggestion: "See the SHGs with no village recorded?"

    - condition: "result_has_high_cif"
      suggestion: "See the figures without the SHGs above ₹5 lakh CIF?"

# ===========================================================================
# v1.1 - 2026-10-05 - RENDERED EXAMPLES
#
# Each example shows the templates used and the final answer text, filled with
# real figures from datasets/NRLM/NRLM.csv (grouped by LGD code), in the Indian
# number format set in `formatting`. Use these to test the composer and as the
# reference for tone.
# ===========================================================================
rendered_examples:

- question: "How many SHGs are there in Meghalaya?"
  templates: [shg_count_with_status, shg_grain_note, snapshot_note]
  answer: >
    Meghalaya has 40,629 SHGs - 39,432 active and 1,197 inactive. One row is one Self
    Help Group, so this is a count of groups, not of people. Figures describe the SHG
    register as at the current extract.
  follow_up: "See how many members these SHGs have?"

- question: "How many SHG members are there?"
  templates: [member_count, women_share_note]
  answer: >
    SHGs in Meghalaya have 4,10,847 members - 4,09,249 women and 1,598 men. 99.61% of SHG
    members are women; 39,924 of 40,629 SHGs have no male member.
  follow_up: "See the average members per SHG?"

- question: "Total RF and CIF statewide"
  templates: [fund_pair, cumulative_money_note, unit_unconfirmed_note]
  answer: >
    SHGs in Meghalaya have received ₹50.86 crore in Revolving Fund and ₹98.48 crore in
    Community Investment Fund to date. Amounts are cumulative - what each SHG has received
    to date, as at the current data extract - not releases in any one year. Amounts are
    taken to be rupees; MSRLS has not yet confirmed the unit.

- question: "Which district has the most CIF?"
  templates: [ranked_list, cumulative_money_note]
  answer: >
    West Jaintia Hills has received the most CIF - ₹18.89 crore to date, followed by
    East Khasi Hills (₹10.66 crore) and West Khasi Hills (₹9.53 crore). Amounts are
    cumulative to the current extract, not releases in any one year.
  follow_up: "See how many SHGs have received CIF at all?"

- question: "What share of SHGs in East Khasi Hills have CIF?"
  templates: [fund_coverage, outlier_note]
  answer: >
    795 of 6,768 SHGs in East Khasi Hills (11.75%) have received Community Investment
    Fund - the lowest share of any district, though it has the most SHGs. South West
    Khasi Hills is highest at 52.33%.

- question: "Average CIF in West Jaintia Hills"
  templates: [average_fund_two_populations, cumulative_money_note]
  answer: >
    Across all SHGs in West Jaintia Hills the average CIF is ₹46,589; among the 2,043 SHGs
    that received it, ₹92,471. Amounts are cumulative to date.

- question: "Show SHG 3329"
  templates: [shg_detail, high_cif_note]
  answer: >
    SHG 3329, Aibhahlang Shg Nongsohphan, is a New group formed in 2017-18, in Nongsohphan
    village, Pynursla block, East Khasi Hills district. It is Active, with 12 members (12
    women), and has received ₹15,000 Revolving Fund and ₹13,60,000 CIF to date. This is the
    highest CIF in the State; 39 SHGs hold more than ₹5 lakh CIF and these values are not
    yet confirmed by MSRLS.

- question: "Show SHG 7194"
  templates: [shg_detail, inactive_zero_fund_note]
  answer: >
    SHG 7194, Sun Flower, is a New group formed in 2017-18, in Rogu Alda village, Dambo
    Rongjeng block, East Garo Hills district. It is Inactive, with 9 members (9 women), and
    has received ₹0 Revolving Fund and ₹0 CIF to date. All inactive SHGs show zero RF and
    CIF in the source; the reason is not recorded.

- question: "Show Iatreilang Shg"
  templates: [shg_name_matches]
  answer: >
    295 SHGs are called 'Iatreilang Shg'. Give me the SHG code, or the block or village, to
    pick one: East Khasi Hills 113, Ri Bhoi 42, Eastern West Khasi Hills 38, West Khasi
    Hills 38, East Jaintia Hills 23, West Jaintia Hills 23, South West Khasi Hills 18.

- question: "How many SHGs were formed in 2020-21?"
  templates: [formation_count, formation_year_note]
  answer: >
    11,354 SHGs in Meghalaya were formed in 2020-21 - the highest of any year. The year
    shown is the year each SHG was formed - the only year in this data.

- question: "Compare SHG formation in 2019-20 and 2020-21"
  templates: [formation_cohort_comparison]
  answer: "10,604 SHGs were formed in 2019-20 against 11,354 in 2020-21 - a difference of 750."

- question: "How much CIF do SHGs formed in 2017-18 hold?"
  templates: [cohort_fund_holding]
  answer: >
    SHGs formed in 2017-18 hold ₹25.08 crore in Community Investment Fund today. This is
    what that group of SHGs has received to date, not what was released in 2017-18.

- question: "How much RF was released in 2021-22?"
  templates: [money_in_year_refused]
  answer: >
    Fund amounts are cumulative totals each SHG has received, with no release date, so
    they cannot be split by year. I can show what SHGs formed in 2021-22 hold today -
    ₹6.69 crore RF - clearly labelled as that.
  follow_up: "See what SHGs formed in that year hold today?"

- question: "Growth in CIF over the last 3 years"
  templates: [money_trend_refused]
  answer: >
    The data is a single snapshot with no release dates, so a trend or growth in funds
    cannot be calculated. Current totals by district, or SHG formation by year, are
    available.

- question: "SHG savings in Ri Bhoi"
  templates: [savings_not_held]
  answer: >
    Savings, bank linkage and loans are not held. The only money recorded is the Revolving
    Fund (₹5.25 crore in Ri Bhoi) and Community Investment Fund (₹8.85 crore) each SHG has
    received.

- question: "Which VO has the most SHGs?"
  templates: [federation_not_held]
  answer: "Village Organisations and Cluster Level Federations are not held - there is no federation identifier in this data."

- question: "SHGs in Mawhati"
  templates: [shg_count, colliding_name_resolved, constituency_vs_block_note]
  answer: >
    Mawhati has 69 SHGs on the register. Read 'Mawhati' as a block. It is also the name of
    a constituency - say 'constituency Mawhati' for that reading. Mawhati block and
    Mawhati constituency cover different areas: 69 SHGs in the block, 519 in the
    constituency.

- question: "Villages with SHGs in Umsning"
  templates: [coverage_statement, unresolved_village_note]
  answer: >
    83 villages in Umsning have at least one SHG. 316 SHGs have no village recorded; they
    are counted in block and district totals but not in village figures.

- question: "SHGs by constituency, top 5"
  templates: [ranked_list, constituency_coverage_note]
  answer: >
    Top 5 constituencies by SHGs: Khliehriat (6) 1,357; Sutnga-saipung (5) 1,309;
    Rangsakona (52) 1,114; Mawkyrwat (36) 1,092; Mowkaiaw (4) 1,066. Constituency is not
    recorded for 2,032 SHGs, so these figures add up to 38,597, not the State total of
    40,629.

- question: "SHGs in Khasi Hills"
  templates: [shg_count, region_expansion_note]
  answer: >
    Khasi Hills has 12,557 SHGs on the register. Khasi Hills covers East Khasi Hills, West
    Khasi Hills, South West Khasi Hills and Eastern West Khasi Hills.

- question: "SHGs by district - East Jaintia Hills"
  templates: [shg_count, district_by_code_note]
  answer: >
    East Jaintia Hills has 2,744 SHGs on the register. Districts follow the LGD code. 12
    SHGs named 'Eastern West Khasi Hills' in the source file are counted under East
    Jaintia Hills, their LGD district.

- question: "How many pre-NRLM SHGs?"
  templates: [single_value, pre_nrlm_note]
  answer: >
    Pre-NRLM SHGs for Meghalaya is 432. 'Pre-NRLM' here is the SHG type (432 SHGs), not
    the formation year - 645 SHGs were formed before 2011-12.

- question: "Duplicate SHGs?"
  templates: [duplicate_registration_note, lookup_list]
  answer: >
    5 pairs of SHGs look like double registrations (identical except for their code); both
    are counted until MSRLS confirms. Matches: Green Hills Shg Msrls (34950, 36695),
    Shankylliang Shg Mukroh (36022, 36898), Kyrshanlang Shg Nangbah (26645, 32193),
    Snohktilang Shg Nongsangu (19973, 20705), Purangang Marngar Shg Ii (3875, 3880).

- question: "SHGs outside the membership norm"
  templates: [out_of_norm_note]
  answer: >
    178 SHGs have membership outside the NRLM norm of 10 to 20 members, including 5 with
    no members recorded. 74 have 1-4 members and 99 have more than 20 (the largest,
    Mahila Bhobisshot Ujjwala in Mawsynram, has 38).

- question: "Top 5 blocks by RF"
  templates: [ranked_list, rf_ranking_note]
  answer: >
    Top 5 blocks by Revolving Fund: Laskein ₹2.70 crore, Wapung ₹2.20 crore, Thadlaskein
    ₹1.86 crore, Umling ₹1.67 crore, Rerapara ₹1.60 crore. Most SHGs hold the same ₹15,000
    Revolving Fund, so a ranking by RF closely follows the number of SHGs that received it.

- question: "SHGs in Dadenggiri that got CIF"
  templates: [all_zero_result]
  answer: >
    SHGs in Dadenggiri have received zero Community Investment Fund. The zero is a
    recorded value, not missing data.
  follow_up: "Check whether these SHGs are inactive?"

- question: "SHGs in Cherrapunji"
  templates: [entity_not_found]
  answer: "'Cherrapunji' is not in the NRLM data. Closest matches: Sohra constituency (624 SHGs), Shella Bholaganj block."

- question: "SHGs formed in 1990"
  templates: [outside_data_span]
  answer: "No SHG formed in 1990-91 is on the register. Formation years run from 1984-85 to 2022-23."

- question: "Villages with both SHGs and PMAY houses in Ri Bhoi"
  templates: [cross_scheme_caveat]
  answer_shape: >
    "{both} villages in Ri Bhoi have both SHGs and PMAY houses ... NRLM figures are the
    current SHG register, while PMAY figures are for the sanction years held - they sit
    side by side but are not like for like."
  note: NRLM side is 458 villages in Ri Bhoi; the PMAY side is not computed here.
