# focusplus_few_shot.yaml
#
# Validated question-to-SQL pairs for Focus Plus - node 5.10.
#
# ===========================================================================
# v1.0 - 2026-09-03 - WRITTEN AGAINST THE CURATED STAR SCHEMA
#
# Focus Plus was loaded straight into curated on 2026-09-02, so there is no
# flat-table ancestor and no retired v1 SQL to keep as a negative example.
#
# House rules encoded in every example below:
#   FROM curated.v_focus_plus       never fact_focus_plus_disbursement
#   NO placeholder predicate        Focus Plus has no is_placeholder column.
#                                   Copying PMAY's WHERE NOT is_placeholder
#                                   here does not just mislead - it ERRORS.
#   COUNT(*) is aliased `payments`  one row is one payment, never one person
#   COUNT(DISTINCT member_id)       the 12.5K cohort ONLY - never the scheme total
#   batch_label = '12.5K'           on every gender / occupation / status question
#   lgd_district / lgd_block        UPPERCASE literals - dim_geography stores them so
#   village_code                    for counting villages, never a name
#   amount_disbursed left AS STORED never /1e7 - the unit is unverified, read
#                                   curated.dim_scheme.money_unit before formatting
#   tranche_label                   grouped as a CATEGORY, never ordered as time
#   'Tranch' not 'Tranche'          the stored spelling
#   member_id / pincode             never in a SELECT list - rule 7. A null-test
#                                   inside an aggregate is permitted; it returns a
#                                   count, not an identifier.
#
# Questions that must be REFUSED live in focusplus_schema_partitions.yaml,
# which carries 13 of them with sql: null. They are not repeated here, the same
# way PMAY keeps its refusals in stage2.
#
# NOT ONE OF THESE QUERIES HAS BEEN EXECUTED against megh_db. They are correct
# against the structure in SCHEMA_FOR_DEVELOPERS.md (2026-09-02) and unverified
# against the data. Every expected figure quoted in a note is a source-CSV
# observation (2026-09-03). Run meta.v_reconciliation_focus_plus first.
# ===========================================================================

sql_generation_examples:

# ---- totals and the three beneficiary readings -------------------------
- question: How many Focus Plus disbursements are there?
  sql: |
    SELECT COUNT(*) AS payments
    FROM curated.v_focus_plus;
  tables:
  - curated.v_focus_plus

- question: How many Focus Plus beneficiaries are there?
  sql: |
    SELECT COUNT(*)                                  AS payments,
           COUNT(DISTINCT member_id)                 AS members_with_an_id,
           COUNT(DISTINCT source_sl_no)              AS source_serials,
           COUNT(*) FILTER (WHERE member_id IS NULL) AS payments_with_no_member_id
    FROM curated.v_focus_plus;
  tables:
  - curated.v_focus_plus
  note: 'Three readings differ by an order of magnitude, so all are returned and labelled.
    members_with_an_id covers the 12.5K cohort only. The workbook''s 93,286 legacy figure
    came from epic_id, which was dropped at ingest, and is not derivable here.'

- question: How many members are in the legacy paid batch?
  sql: |
    SELECT COUNT(DISTINCT source_sl_no) AS legacy_beneficiaries,
           COUNT(*)                     AS legacy_payments
    FROM curated.v_focus_plus
    WHERE batch_label = '93K';
  tables:
  - curated.v_focus_plus
  note: 'source_sl_no is a FILE SERIAL, not a person key - say so. It is the closest
    proxy available now that epic_id is gone. Expect roughly four payments per serial.'

- question: How many payments are in each batch?
  sql: |
    SELECT batch_label,
           COUNT(*)                     AS payments,
           COUNT(DISTINCT source_sl_no) AS beneficiaries_in_batch
    FROM curated.v_focus_plus
    GROUP BY batch_label
    ORDER BY payments DESC;
  tables:
  - curated.v_focus_plus

- question: What is the total amount disbursed under Focus Plus?
  sql: |
    SELECT COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus;
  tables:
  - curated.v_focus_plus
  note: 'Left in the stored unit deliberately - amount_disbursed has no documented unit.
    Read curated.dim_scheme.money_unit before formatting. Never divide by 1e7 on an
    assumption.'

- question: What unit are Focus Plus amounts in?
  sql: |
    SELECT scheme_code, scheme_name, money_unit, time_semantics, grain_note
    FROM curated.dim_scheme;
  tables:
  - curated.dim_scheme

- question: What is the standard Focus Plus payment?
  sql: |
    SELECT amount_disbursed, batch_label, tranche_label,
           COUNT(*) AS payments
    FROM curated.v_focus_plus
    GROUP BY amount_disbursed, batch_label, tranche_label
    ORDER BY payments DESC;
  tables:
  - curated.v_focus_plus
  note: 'There is no single flat rate. Tranch 1 paid 5,000 and the later tranches 2,500,
    so the distribution is the answer. The use-case workbook''s flat-5,000 premise is wrong.'

- question: How many payments were made at each rate?
  sql: |
    SELECT amount_disbursed, COUNT(*) AS payments
    FROM curated.v_focus_plus
    GROUP BY amount_disbursed
    ORDER BY amount_disbursed DESC;
  tables:
  - curated.v_focus_plus

# ---- geography ---------------------------------------------------------
- question: How many Focus Plus payments are there in West Garo Hills?
  sql: |
    SELECT COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE lgd_district = 'WEST GARO HILLS';
  tables:
  - curated.v_focus_plus

- question: How many Focus Plus payments are there in East Khasi Hills?
  sql: |
    SELECT COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE lgd_district = 'EAST KHASI HILLS';
  tables:
  - curated.v_focus_plus

- question: Show Focus Plus payments by district
  sql: |
    SELECT lgd_district,
           COUNT(*)                  AS payments,
           COUNT(DISTINCT member_id) AS members_with_an_id,
           SUM(amount_disbursed)     AS amount_raw
    FROM curated.v_focus_plus
    GROUP BY lgd_district
    ORDER BY payments DESC;
  tables:
  - curated.v_focus_plus

- question: Which district has the most Focus Plus payments?
  sql: |
    SELECT lgd_district, COUNT(*) AS payments
    FROM curated.v_focus_plus
    GROUP BY lgd_district
    ORDER BY payments DESC
    LIMIT 1;
  tables:
  - curated.v_focus_plus

- question: Which district has the fewest Focus Plus payments?
  sql: |
    SELECT lgd_district, COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE lgd_district IS NOT NULL
    GROUP BY lgd_district
    ORDER BY payments ASC
    LIMIT 1;
  tables:
  - curated.v_focus_plus

- question: Top 5 districts by Focus Plus payments
  sql: |
    SELECT lgd_district, COUNT(*) AS payments
    FROM curated.v_focus_plus
    GROUP BY lgd_district
    ORDER BY payments DESC
    LIMIT 5;
  tables:
  - curated.v_focus_plus

- question: Bottom 5 districts by Focus Plus payments
  sql: |
    SELECT lgd_district, COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE lgd_district IS NOT NULL
    GROUP BY lgd_district
    ORDER BY payments ASC
    LIMIT 5;
  tables:
  - curated.v_focus_plus

- question: Top 5 districts by Focus Plus disbursement
  sql: |
    SELECT lgd_district,
           SUM(amount_disbursed) AS amount_raw,
           COUNT(*)              AS payments
    FROM curated.v_focus_plus
    GROUP BY lgd_district
    ORDER BY amount_raw DESC
    LIMIT 5;
  tables:
  - curated.v_focus_plus

- question: Which districts have more than 5000 Focus Plus payments?
  sql: |
    SELECT lgd_district, COUNT(*) AS payments
    FROM curated.v_focus_plus
    GROUP BY lgd_district
    HAVING COUNT(*) > 5000
    ORDER BY payments DESC;
  tables:
  - curated.v_focus_plus

- question: Which districts have fewer than 1000 Focus Plus payments?
  sql: |
    SELECT lgd_district, COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE lgd_district IS NOT NULL
    GROUP BY lgd_district
    HAVING COUNT(*) < 1000
    ORDER BY payments ASC;
  tables:
  - curated.v_focus_plus

- question: Compare West Garo Hills and East Khasi Hills on Focus Plus
  sql: |
    SELECT lgd_district,
           COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    WHERE lgd_district IN ('WEST GARO HILLS', 'EAST KHASI HILLS')
    GROUP BY lgd_district
    ORDER BY payments DESC;
  tables:
  - curated.v_focus_plus

- question: What percentage of Focus Plus payments are in West Garo Hills?
  sql: |
    SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE lgd_district = 'WEST GARO HILLS')
                 / COUNT(*), 2) AS pct_west_garo_hills
    FROM curated.v_focus_plus;
  tables:
  - curated.v_focus_plus

- question: Rank all districts by Focus Plus disbursement and show their share
  sql: |
    SELECT lgd_district,
           COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw,
           ROUND(100.0 * SUM(amount_disbursed)
                 / SUM(SUM(amount_disbursed)) OVER (), 2) AS pct_of_state
    FROM curated.v_focus_plus
    GROUP BY lgd_district
    ORDER BY amount_raw DESC;
  tables:
  - curated.v_focus_plus

- question: Top 5 blocks by Focus Plus payments
  sql: |
    SELECT lgd_block, lgd_district, COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE NOT has_geo_conflict
    GROUP BY lgd_block, lgd_district
    ORDER BY payments DESC
    LIMIT 5;
  tables:
  - curated.v_focus_plus

- question: Top blocks in West Garo Hills by Focus Plus payments
  sql: |
    SELECT lgd_block, COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE NOT has_geo_conflict
      AND lgd_district = 'WEST GARO HILLS'
    GROUP BY lgd_block
    ORDER BY payments DESC
    LIMIT 5;
  tables:
  - curated.v_focus_plus

- question: How many Focus Plus payments are in Selsella block?
  sql: |
    SELECT lgd_block, lgd_district, COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE lgd_block = 'SELSELLA'
    GROUP BY lgd_block, lgd_district;
  tables:
  - curated.v_focus_plus

- question: Top 5 villages by Focus Plus payments
  sql: |
    SELECT village_code, lgd_village_name, lgd_block, lgd_district,
           COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE NOT has_geo_conflict
    GROUP BY village_code, lgd_village_name, lgd_block, lgd_district
    ORDER BY payments DESC
    LIMIT 5;
  tables:
  - curated.v_focus_plus

- question: How many distinct villages have Focus Plus payments in South Garo Hills?
  sql: |
    SELECT COUNT(DISTINCT village_code) AS villages
    FROM curated.v_focus_plus
    WHERE lgd_district = 'SOUTH GARO HILLS';
  tables:
  - curated.v_focus_plus

- question: How many villages does Focus Plus reach in each district?
  sql: |
    SELECT lgd_district,
           COUNT(DISTINCT village_code) AS villages,
           COUNT(DISTINCT lgd_block)    AS blocks,
           COUNT(*)                     AS payments
    FROM curated.v_focus_plus
    GROUP BY lgd_district
    ORDER BY villages DESC;
  tables:
  - curated.v_focus_plus

- question: Which villages have only one Focus Plus payment?
  sql: |
    SELECT village_code, lgd_village_name, lgd_district, entity_type,
           COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE NOT has_geo_conflict
    GROUP BY village_code, lgd_village_name, lgd_district, entity_type
    HAVING COUNT(*) = 1
    ORDER BY lgd_district, lgd_village_name;
  tables:
  - curated.v_focus_plus

- question: How many Focus Plus payments fall in wards rather than villages?
  sql: |
    SELECT entity_type, COUNT(*) AS payments
    FROM curated.v_focus_plus
    GROUP BY entity_type
    ORDER BY payments DESC;
  tables:
  - curated.v_focus_plus

- question: How many districts does Focus Plus reach?
  sql: |
    SELECT COUNT(DISTINCT lgd_district) AS districts,
           COUNT(DISTINCT lgd_block)    AS blocks,
           COUNT(DISTINCT village_code) AS villages
    FROM curated.v_focus_plus;
  tables:
  - curated.v_focus_plus

- question: How many Focus Plus payments are in the Garo Hills region?
  sql: |
    SELECT COUNT(*) AS payments, SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    WHERE lgd_district IN ('EAST GARO HILLS', 'NORTH GARO HILLS', 'SOUTH GARO HILLS',
                           'SOUTH WEST GARO HILLS', 'WEST GARO HILLS');
  tables:
  - curated.v_focus_plus
  note: 'Hill-range groupings are NOT a column in megh_db - they expand to an IN list.
    State which districts were included.'

- question: Compare the Garo Hills and Khasi Hills regions on Focus Plus
  sql: |
    SELECT CASE
             WHEN lgd_district IN ('EAST GARO HILLS', 'NORTH GARO HILLS',
                                   'SOUTH GARO HILLS', 'SOUTH WEST GARO HILLS',
                                   'WEST GARO HILLS')        THEN 'Garo Hills'
             WHEN lgd_district IN ('EAST KHASI HILLS', 'EASTERN WEST KHASI HILLS',
                                   'SOUTH WEST KHASI HILLS',
                                   'WEST KHASI HILLS')       THEN 'Khasi Hills'
             WHEN lgd_district IN ('EAST JAINTIA HILLS',
                                   'WEST JAINTIA HILLS')     THEN 'Jaintia Hills'
             WHEN lgd_district = 'RI BHOI'                   THEN 'Ri Bhoi'
             ELSE 'Unassigned'
           END                   AS region,
           COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    GROUP BY region
    ORDER BY payments DESC;
  tables:
  - curated.v_focus_plus

- question: Average Focus Plus payments per district
  sql: |
    SELECT ROUND(AVG(payments), 1) AS avg_payments_per_district
    FROM (
      SELECT lgd_district, COUNT(*) AS payments
      FROM curated.v_focus_plus
      GROUP BY lgd_district
    ) d;
  tables:
  - curated.v_focus_plus

- question: Average Focus Plus payments per village
  sql: |
    SELECT ROUND(AVG(payments), 2) AS avg_payments_per_village
    FROM (
      SELECT village_code, COUNT(*) AS payments
      FROM curated.v_focus_plus
      GROUP BY village_code
    ) v;
  tables:
  - curated.v_focus_plus

- question: Top 3 blocks in every district by Focus Plus payments
  sql: |
    SELECT lgd_district, lgd_block, payments, rn AS rank_in_district
    FROM (
      SELECT lgd_district, lgd_block, COUNT(*) AS payments,
             ROW_NUMBER() OVER (PARTITION BY lgd_district
                                ORDER BY COUNT(*) DESC) AS rn
      FROM curated.v_focus_plus
      WHERE NOT has_geo_conflict
      GROUP BY lgd_district, lgd_block
    ) r
    WHERE rn <= 3
    ORDER BY lgd_district, rn;
  tables:
  - curated.v_focus_plus

- question: Which blocks have the fewest Focus Plus payments?
  sql: |
    SELECT lgd_block, lgd_district, COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE NOT has_geo_conflict
      AND lgd_block IS NOT NULL
    GROUP BY lgd_block, lgd_district
    ORDER BY payments ASC
    LIMIT 5;
  tables:
  - curated.v_focus_plus

# ---- batch and tranche -------------------------------------------------
- question: Show Focus Plus disbursements by tranche
  sql: |
    SELECT batch_label, tranche_label,
           COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    GROUP BY batch_label, tranche_label
    ORDER BY batch_label, tranche_label;
  tables:
  - curated.v_focus_plus
  note: 'Grouped by batch as well, because Tranch 4 contains BOTH cohorts. Ordering is
    by label, not by time - the month words in the labels are not dates.'

- question: Compare disbursements between Tranch 1 and Tranch 2
  sql: |
    SELECT tranche_label,
           COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    WHERE tranche_label IN ('Tranch 1', 'Tranch 2 - August')
    GROUP BY tranche_label
    ORDER BY tranche_label;
  tables:
  - curated.v_focus_plus
  note: 'A comparison names TWO OR MORE tranches - filter on all of them with IN and
    GROUP BY tranche_label so each gets its own row. Never collapse a comparison to a
    single WHERE tranche_label = value, and never sum the named tranches into one row.'

- question: How many payments were made in Tranch 2?
  sql: |
    SELECT COUNT(*) AS payments, SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    WHERE tranche_label = 'Tranch 2 - August';
  tables:
  - curated.v_focus_plus

- question: Split Tranch 4 by batch
  sql: |
    SELECT batch_label,
           COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    WHERE tranche_label = 'Tranch 4 - Feb-March'
    GROUP BY batch_label
    ORDER BY payments DESC;
  tables:
  - curated.v_focus_plus

- question: How many Focus Plus payments were made in each financial year?
  sql: |
    SELECT financial_year_short,
           COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    GROUP BY financial_year_short
    ORDER BY financial_year_short;
  tables:
  - curated.v_focus_plus
  note: 'Only two years hold data - 2022-23 and 2025-26 - with a three-year gap between
    them. Present as two points, never as a trend line.'

- question: Show Focus Plus payments by financial year and batch
  sql: |
    SELECT financial_year_short, batch_label,
           COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    GROUP BY financial_year_short, batch_label
    ORDER BY financial_year_short, batch_label;
  tables:
  - curated.v_focus_plus

- question: How much was disbursed in FY 2025-26?
  sql: |
    SELECT COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    WHERE financial_year_short = '2025-26';
  tables:
  - curated.v_focus_plus

- question: Show Focus Plus payments by district and financial year
  sql: |
    SELECT lgd_district, financial_year_short, COUNT(*) AS payments
    FROM curated.v_focus_plus
    GROUP BY lgd_district, financial_year_short
    ORDER BY lgd_district, financial_year_short;
  tables:
  - curated.v_focus_plus

# ---- person attributes - 12.5K cohort only -----------------------------
- question: How many Focus Plus beneficiaries are women?
  sql: |
    SELECT gender,
           COUNT(*) AS registrations,
           ROUND(100.0 * COUNT(*) / SUM(COUNT(*)) OVER (), 1) AS pct_of_cohort
    FROM curated.v_focus_plus
    WHERE batch_label = '12.5K'
      AND gender IS NOT NULL
    GROUP BY gender
    ORDER BY registrations DESC;
  tables:
  - curated.v_focus_plus
  note: 'Scoped to the 12.5K cohort because gender is NULL on all 373,144 legacy rows.
    The answer MUST say it covers about 3% of the scheme, not the whole of it.'

- question: What is the gender split in Focus Plus by district?
  sql: |
    SELECT lgd_district,
           COUNT(*) FILTER (WHERE gender = 'Female') AS female,
           COUNT(*) FILTER (WHERE gender = 'Male')   AS male,
           COUNT(*)                                  AS registrations
    FROM curated.v_focus_plus
    WHERE batch_label = '12.5K'
    GROUP BY lgd_district
    ORDER BY registrations DESC;
  tables:
  - curated.v_focus_plus

- question: How many Focus Plus members are farmers?
  sql: |
    SELECT occupation, COUNT(*) AS registrations
    FROM curated.v_focus_plus
    WHERE batch_label = '12.5K'
    GROUP BY occupation
    ORDER BY registrations DESC;
  tables:
  - curated.v_focus_plus

- question: Show the occupation breakdown of Focus Plus members by district
  sql: |
    SELECT lgd_district, occupation, COUNT(*) AS registrations
    FROM curated.v_focus_plus
    WHERE batch_label = '12.5K'
      AND occupation IS NOT NULL
    GROUP BY lgd_district, occupation
    ORDER BY lgd_district, registrations DESC;
  tables:
  - curated.v_focus_plus

- question: How many women farmers are registered under Focus Plus?
  sql: |
    SELECT COUNT(*) AS registrations
    FROM curated.v_focus_plus
    WHERE batch_label = '12.5K'
      AND gender = 'Female'
      AND occupation = 'Farmer';
  tables:
  - curated.v_focus_plus

- question: Cross-tab Focus Plus registrations by gender and occupation
  sql: |
    SELECT occupation,
           COUNT(*) FILTER (WHERE gender = 'Female') AS female,
           COUNT(*) FILTER (WHERE gender = 'Male')   AS male,
           COUNT(*)                                  AS total
    FROM curated.v_focus_plus
    WHERE batch_label = '12.5K'
      AND occupation IS NOT NULL
    GROUP BY occupation
    ORDER BY total DESC;
  tables:
  - curated.v_focus_plus

# ---- status ------------------------------------------------------------
- question: What Focus Plus status values are recorded?
  sql: |
    SELECT focus_status, verification_status, COUNT(*) AS rows_
    FROM curated.v_focus_plus
    GROUP BY focus_status, verification_status
    ORDER BY rows_ DESC;
  tables:
  - curated.v_focus_plus
  note: 'ENUMERATE BEFORE FILTERING. Both columns are uncontrolled varchars - there is no
    dim_focus_plus_status and no roll-up flag. Run this before writing any status filter.'

- question: How many Focus Plus registrations are still pending?
  sql: |
    SELECT focus_status, COUNT(*) AS registrations
    FROM curated.v_focus_plus
    WHERE batch_label = '12.5K'
    GROUP BY focus_status
    ORDER BY registrations DESC;
  tables:
  - curated.v_focus_plus
  note: 'One value is a singleton - a single Rejected record. Never present it as a
    percentage or a trend without saying n=1.'

- question: Show pending Focus Plus registrations by district
  sql: |
    SELECT lgd_district, COUNT(*) AS pending_registrations
    FROM curated.v_focus_plus
    WHERE batch_label = '12.5K'
      AND focus_status = 'Pending'
    GROUP BY lgd_district
    ORDER BY pending_registrations DESC;
  tables:
  - curated.v_focus_plus

- question: How many Focus Plus registrations were approved?
  sql: |
    SELECT COUNT(*) AS approved_registrations
    FROM curated.v_focus_plus
    WHERE batch_label = '12.5K'
      AND focus_status = 'Approved';
  tables:
  - curated.v_focus_plus
  note: 'Approved means the REGISTRATION was approved, not that a payment was made - and
    these rows are in the cohort that has not been paid. Reading it as paid inverts the answer.'

# ---- paid versus unpaid ------------------------------------------------
- question: Compare paid and unpaid Focus Plus members by district
  sql: |
    SELECT lgd_district,
           COUNT(*) FILTER (WHERE batch_label = '93K')   AS legacy_paid_payments,
           COUNT(*) FILTER (WHERE batch_label = '12.5K') AS newer_registrations
    FROM curated.v_focus_plus
    GROUP BY lgd_district
    ORDER BY legacy_paid_payments DESC;
  tables:
  - curated.v_focus_plus
  note: 'No column encodes payment. batch_label is the only available discriminator and
    using it is an INFERENCE - the answer must say so.'

- question: How many Focus Plus members are registered but not yet paid?
  sql: |
    SELECT COUNT(DISTINCT member_id) AS registered_members,
           COUNT(*)                  AS registration_rows
    FROM curated.v_focus_plus
    WHERE batch_label = '12.5K';
  tables:
  - curated.v_focus_plus
  note: 'An estimate, not a count. In the source 111 people appear in both cohorts, so
    this overstates the backlog - and because epic_id was dropped, that overlap cannot be
    detected in megh_db at all. Say both things.'

- question: Which districts does the newer Focus Plus batch not reach?
  sql: |
    SELECT lgd_district,
           COUNT(*) FILTER (WHERE batch_label = '12.5K') AS newer_registrations,
           COUNT(*)                                      AS total_payments
    FROM curated.v_focus_plus
    GROUP BY lgd_district
    HAVING COUNT(*) FILTER (WHERE batch_label = '12.5K') = 0
    ORDER BY total_payments DESC;
  tables:
  - curated.v_focus_plus

# ---- money by dimension ------------------------------------------------
- question: How much was disbursed in West Garo Hills?
  sql: |
    SELECT COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    WHERE lgd_district = 'WEST GARO HILLS';
  tables:
  - curated.v_focus_plus

- question: What is the average Focus Plus payment per member?
  sql: |
    SELECT SUM(amount_disbursed)                       AS amount_raw,
           COUNT(DISTINCT source_sl_no)                AS beneficiaries,
           ROUND(SUM(amount_disbursed)::numeric
                 / NULLIF(COUNT(DISTINCT source_sl_no), 0), 2) AS amount_per_beneficiary
    FROM curated.v_focus_plus
    WHERE batch_label = '93K';
  tables:
  - curated.v_focus_plus
  note: 'Total over a member count, NOT AVG(amount_disbursed) - which would return a mix
    ratio between the 5,000 and 2,500 rates rather than an entitlement. Scoped to one
    batch so the denominator is well defined.'

- question: Show Focus Plus disbursement by block
  sql: |
    SELECT lgd_block, lgd_district,
           COUNT(*)              AS payments,
           SUM(amount_disbursed) AS amount_raw
    FROM curated.v_focus_plus
    WHERE NOT has_geo_conflict
    GROUP BY lgd_block, lgd_district
    ORDER BY amount_raw DESC;
  tables:
  - curated.v_focus_plus

# ---- data quality ------------------------------------------------------
- question: How many Focus Plus payments could not be matched to a financial year?
  sql: |
    SELECT COUNT(*) FILTER (WHERE year_key IS NULL) AS unresolved_year,
           COUNT(*)                                 AS total
    FROM curated.v_focus_plus;
  tables:
  - curated.v_focus_plus
  note: 'Both source financial years fall inside the dim_year window, so this should be
    ZERO. Unlike PMAY, a non-zero result is a load defect to investigate, not a footnote.'

- question: How many Focus Plus payments are on villages with conflicting geography?
  sql: |
    SELECT has_geo_conflict, COUNT(*) AS payments
    FROM curated.v_focus_plus
    GROUP BY has_geo_conflict;
  tables:
  - curated.v_focus_plus

- question: Which Focus Plus villages have conflicting district or block records?
  sql: |
    SELECT village_code, lgd_village_name, lgd_block, lgd_district,
           COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE has_geo_conflict
    GROUP BY village_code, lgd_village_name, lgd_block, lgd_district
    ORDER BY payments DESC;
  tables:
  - curated.v_focus_plus

- question: Run a Focus Plus data-quality audit
  sql: |
    SELECT COUNT(*)                                          AS total_payments,
           COUNT(*) FILTER (WHERE year_key IS NULL)          AS no_financial_year,
           COUNT(*) FILTER (WHERE has_geo_conflict)          AS geo_conflict_rows,
           COUNT(*) FILTER (WHERE lgd_district IS NULL)      AS no_district,
           COUNT(*) FILTER (WHERE lgd_village_name IS NULL)  AS no_village_name,
           COUNT(*) FILTER (WHERE NOT on_roster)             AS off_roster_geography,
           COUNT(*) FILTER (WHERE batch_label = '93K')        AS legacy_rows_no_member_id
    FROM curated.v_focus_plus;
  tables:
  - curated.v_focus_plus
  note: 'legacy_rows_no_member_id is expected to be large - it is the whole legacy cohort by design,
    not a defect. Missing mobile numbers and duplicate names cannot be audited: those
    columns were dropped at ingest.'

- question: Are Focus Plus block names stored cleanly?
  sql: |
    SELECT lgd_block, COUNT(*) AS payments
    FROM curated.v_focus_plus
    WHERE lgd_block <> TRIM(lgd_block)
       OR lgd_block IN ('Nan', 'NaN', 'NULL', '')
    GROUP BY lgd_block
    ORDER BY payments DESC;
  tables:
  - curated.v_focus_plus
  note: 'Should return zero rows. In the SOURCE, 26 of 77 block strings carry a trailing
    space and one is the literal text "Nan". If this returns rows, the ingest did not
    clean them and the resolver catalogue must be revised.'

- question: Cross-tab Focus Plus payments by district and batch
  sql: |
    SELECT lgd_district,
           COUNT(*) FILTER (WHERE batch_label = '93K')   AS legacy,
           COUNT(*) FILTER (WHERE batch_label = '12.5K') AS registration,
           COUNT(*)                                      AS total
    FROM curated.v_focus_plus
    GROUP BY lgd_district
    ORDER BY total DESC;
  tables:
  - curated.v_focus_plus

# ---- cross-scheme ------------------------------------------------------
- question: Is Focus Plus included in the cross-scheme money comparison?
  sql: |
    SELECT DISTINCT scheme_code
    FROM curated.v_cross_scheme_money_district_year;
  tables:
  - curated.v_cross_scheme_money_district_year
  note: 'Structure cannot say which scheme codes that view holds. Run this before any
    answer claims to cover all three schemes, and say so if Focus Plus is absent.'

- question: Compare Focus Plus, PMAY and MGNREGA spending by district
  sql: |
    SELECT lgd_district, scheme_code, financial_year_short,
           amount_crore, measure_semantics
    FROM curated.v_cross_scheme_money_district_year
    WHERE financial_year_short = '2025-26'
    ORDER BY lgd_district, scheme_code;
  tables:
  - curated.v_cross_scheme_money_district_year
  note: 'measure_semantics MUST travel into the answer - the three amounts mean different
    things: money disbursed to individuals, money released against sanctions, and
    expenditure incurred.'

- question: Add Focus Plus to the cross-scheme village coverage view
  sql: |
    WITH fp AS (
      SELECT village_code, COUNT(*) AS focus_plus_payments
      FROM curated.v_focus_plus
      GROUP BY village_code
    )
    SELECT c.village_code, c.lgd_district, c.pmay_houses,
           c.mgnrega_person_days, fp.focus_plus_payments
    FROM curated.v_cross_scheme_village_coverage c
    FULL JOIN fp USING (village_code);
  tables:
  - curated.v_cross_scheme_village_coverage
  - curated.v_focus_plus
  note: 'That view has no Focus Plus column, so the fact is aggregated to village level
    FIRST and the aggregate is joined. Never join the fact itself - all six fact pairs
    are prohibited.'

- question: Which villages get Focus Plus but no PMAY houses?
  sql: |
    WITH fp AS (
      SELECT village_code, COUNT(*) AS focus_plus_payments
      FROM curated.v_focus_plus
      GROUP BY village_code
    )
    SELECT fp.village_code, c.lgd_district, fp.focus_plus_payments
    FROM fp
    LEFT JOIN curated.v_cross_scheme_village_coverage c USING (village_code)
    WHERE c.pmay_houses IS NULL OR c.pmay_houses = 0
    ORDER BY fp.focus_plus_payments DESC;
  tables:
  - curated.v_focus_plus
  - curated.v_cross_scheme_village_coverage

# ---- reconciliation ----------------------------------------------------
- question: Have the Focus Plus totals been verified?
  sql: |
    SELECT * FROM meta.v_reconciliation_focus_plus;
  tables:
  - meta.v_reconciliation_focus_plus
