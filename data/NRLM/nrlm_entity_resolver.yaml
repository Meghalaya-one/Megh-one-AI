  constituency:
    name_column: constituency_name_raw
    number_column: constituency_number_raw
    stored_case: >
      constituency_name_raw is MIXED CASE as typed in the source (e.g. 'Sutnga-saipung',
      'Rambrai jyrngam'). constituency_number_raw is '<number> <UPPERCASE NAME>'.
    distinct: 55
    nulls: 2032
    null_note: NULL on exactly the 2,032 SHGs with no village. A constituency total never reaches the State total.
    sql_predicate: "constituency_name_raw = '<canonical>'"
    sql_predicate_by_number: "constituency_number_raw LIKE '<number> %'"
    number_note: >
      Keep the trailing space in the LIKE pattern - '3 %' must not match '36 MAWKYRWAT'.
      Never cast constituency_number_raw to an integer; it holds the name too.
    not_lgd: >
      Assembly constituencies are an ELECTORAL hierarchy parallel to LGD. A constituency
      can span two districts (e.g. Selsella, Rangsakona). Never treat it as a level
      between district and block.
    numbering_gaps: >
      Numbers 16-19 and 51 are absent - those seats (mostly Shillong urban, and Tura)
      hold no rural SHG in this data. A question about them returns not_found with that
      explanation, not a zero.
