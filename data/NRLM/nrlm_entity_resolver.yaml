  resolve:
  - { text: Saipung, type: block, canonical: Saipung, lgd_code: 2000, assumption: default_level }
  expected: 913
  note: >
    Includes the 12 Tangnub SHGs the source calls 'Mairang'. Saipung is also a village
    (42 SHGs). The constituency is 'Sutnga-saipung' (number 5, 1,309 SHGs) - a contains
    match on 'Saipung' must not pick it without the word "constituency".

- user: "SHGs in Sutnga"
  resolve:
  - { text: Sutnga, type: constituency, canonical: Sutnga-saipung, number: 5, matched_by: 2_alias }
  expected: 1309
  note: Sutnga is also a village in Wapung block (76 SHGs). With no qualifier, prefer the constituency only because no block is called Sutnga - and say so.

- user: "SHGs in William Nagar"
  resolve:
  - { text: William Nagar, type: constituency, canonical: William Nagar, number: 43, matched_by: 1_exact }
  expected: 648
  note: The numbered field stores this as '43 WILLIAM'. Williamnagar is also an alias of East Garo Hills district ("Williamnagar district") - only with the word "district".

- user: "SHGs in AC 36"
  resolve:
  - { text: "AC 36", type: constituency, canonical: Mawkyrwat, number: 36, matched_by: 2_alias }
  sql: "SELECT COUNT(*) FROM curated.v_nrlm WHERE constituency_number_raw LIKE '36 %';"
  expected: 1092

- user: "SHGs in constituency 16"
  resolve:
  - { text: "constituency 16", type: constituency, status: not_found }
  response: >
    Number 16 is not in the NRLM data - numbers 16-19 and 51 hold no rural SHG (mostly
    Shillong urban seats). Say so; do not return 0 as if it were a count.

- user: "ewkh active shgs"
  resolve:
  - { text: ewkh, type: district, canonical: Eastern West Khasi Hills, lgd_code: 740, matched_by: 4_acronym }
  - { text: active, type: shg_status, canonical: true }
  sql: "SELECT COUNT(*) FROM curated.v_nrlm WHERE district_lgd_code = 740 AND is_active;"
  expected: 1559

- user: "SHGs in Mairang district"
  resolve:
  - { text: "Mairang district", type: district, canonical: Eastern West Khasi Hills, lgd_code: 740, matched_by: 2_alias }
  expected: 1610
  note: '"Mairang" alone is the BLOCK (1,069 SHGs). "Mairang district" is the alias of 740. The qualifier decides.'

- user: "SHGs in Jowai district"
  resolve:
  - { text: "Jowai district", type: district, canonical: West Jaintia Hills, lgd_code: 275, matched_by: 2_alias }
  expected: 4055
  note: Jowai alone is a constituency (number 2, 327 SHGs).

- user: "south west garo"
  resolve:
  - { text: south west garo, type: district, canonical: South West Garo Hills, lgd_code: 663, matched_by: 2_alias }
  expected: 3491
  note: Must not land on West Garo Hills (blocked pair) even though "west garo" is a substring.

- user: "revitalised groups in North Garo Hills"
  resolve:
  - { text: revitalised groups, type: shg_type, canonical: Revived, matched_by: 2_alias }
  - { text: North Garo Hills, type: district, canonical: North Garo Hills, lgd_code: 656 }
  sql: "SELECT COUNT(*) FROM curated.v_nrlm WHERE shg_type = 'Revived' AND district_lgd_code = 656;"
  expected: 253

- user: "SGSY groups in East Garo Hills"
  resolve:
  - { text: SGSY groups, type: shg_type, canonical: Pre-Nrlm, matched_by: 2_alias, assumption: stated }
  sql: "SELECT COUNT(*) FROM curated.v_nrlm WHERE shg_type = 'Pre-Nrlm' AND district_lgd_code = 273;"
  expected: 116
  note: State that SGSY-era groups were read as the Pre-NRLM type - the data has no SGSY flag.

- user: "non-functional SHGs in Dadenggiri"
  resolve:
  - { text: non-functional, type: shg_status, canonical: false, matched_by: 2_alias }
  - { text: Dadenggiri, type: block, canonical: Dadenggiri, lgd_code: 1963 }
  expected: 81
  note: Dadenggiri has the lowest active share of any block (84.66%).

- user: "Dadenggre block"
  resolve:
  - { text: Dadenggre, type: block, canonical: Dadenggiri, lgd_code: 1963, matched_by: 2_alias, qualifier: block }
  note: Dadenggre without "block" is the CONSTITUENCY (49, 1,028 SHGs); with "block" it is Dadenggiri (528). Spellings differ by one letter and the areas by 500 SHGs.

- user: "SHGs formed in 2019-2020"
  resolve:
  - { text: "2019-2020", type: formation_year, canonical: '2019-20', matched_by: 3_squash }
  expected: 10604

- user: "groups formed in 1999-2000"
  resolve:
  - { text: "1999-2000", type: formation_year, canonical: '1999-00', matched_by: 3_squash }
  expected: 8
  note: The stored short form is '1999-00' - a naive 'YYYY-(YY+1)' formatter would produce '1999-100'.

- user: "SHG 34950"
  resolve:
  - { text: "SHG 34950", type: shg_code, canonical: 34950 }
  response: >
    Green Hills Shg Msrls, Gumaijhora(Muslim), Demdema block, formed 2021-22, active,
    10 members, RF Rs 15,000. Flag: is_possible_duplicate - SHG 36695 is identical
    except for its code.

- user: "Chibasal Shg in South Garo Hills"
  resolve:
  - { text: Chibasal Shg, type: shg_name, status: ambiguous, matches_statewide: 125 }
  - { text: South Garo Hills, type: district, canonical: South Garo Hills, lgd_code: 277 }
  response: "32 SHGs called Chibasal Shg are in South Garo Hills. Which block, or which SHG code?"
  note: Scoping by district cut 125 candidates to 32 - still ambiguous, so ask again.

- user: "Mahila Bhobisshot Ujjwala"
  resolve:
  - { text: Mahila Bhobisshot Ujjwala, type: shg_name, canonical: Mahila Bhobisshot Ujjwala, shg_code: 8666, matched_by: 1_exact }
  note: Exactly one match, so resolve directly. The largest SHG in the State (38 members, Mawsynram).

- user: "SHGs in Kyndong Tuber GP"
  resolve:
  - { text: Kyndong Tuber, type: gp_name, canonical: Kyndong Tuber, qualifier: GP }
  note: >
    With "GP" it is the gp_name. Without it, the squash stage maps it to the LGD village
    Kyndongtuber (279247, Laskein, 92 SHGs, Rs 90.40 lakh CIF - the highest-CIF village in
    the State). Prefer the village and mention the GP reading.

- user: "how many groups in meghalaya"
  resolve:
  - { text: groups, type: measure, canonical: "COUNT(*)" }
  - { text: meghalaya, type: region, canonical: whole_state }
  expected: 40629

- user: "how much aajeevika money in WJH"
  resolve:
  - { text: aajeevika, type: scheme, canonical: nrlm, matched_by: 2_alias }
  - { text: money, type: measure, status: ambiguous }
  - { text: WJH, type: district, canonical: West Jaintia Hills, lgd_code: 275, matched_by: 4_acronym }
  response: "Which fund - Revolving Fund (Rs 5.67 crore) or CIF (Rs 18.89 crore)? Both are cumulative to date."

maintenance:
  source_files:
  - datasets/NRLM/NRLM.csv                          # 40629 x 20
  - datasets/NRLM/NRLM_Data_Readiness_Document.pdf  # client questionnaire, 8 pages
  schema_authority: SCHEMA_FOR_DEVELOPERS.md         # live database extract, 2026-10-05
  catalogue_generator: >
    District, block, constituency and village-registry sections were generated by a
    pandas script grouping NRLM.csv by LGD code. Re-run it on a new extract rather than
    editing counts by hand.
  row_counts_at_generation: { source_file: 40629, curated.v_nrlm: unverified_in_db }
  data_span_in_source: { first_formation_year: '1984-85', last_formation_year: '2022-23' }
  last_generated: '2026-10-05'

  open_verification_tasks:
    critical: true
    note: >
      v1.0 was written from structure and the source file. NOTHING below has been measured
      against megh_db. Each item is a query to run before any NRLM answer ships.
    tasks:
    - "Row count: SELECT COUNT(*) FROM curated.v_nrlm - expect 40629."
    - "dim_year coverage: do all 30 formation years resolve? See formation_year.dim_year_coverage_conflict."
    - "Geography casing: confirm lgd_district and lgd_block are UPPERCASE, and that district 740 is stored as 'EASTERN WEST KHASI HILLS'."
    - "Unresolved: SELECT COUNT(*) FROM curated.v_nrlm WHERE entity_type = 'Unresolved' - expect 2032."
    - "Name-code conflict: confirm the 12 has_name_code_conflict rows show lgd_district = 'EAST JAINTIA HILLS'."
    - "dim_scheme: read NRLM's scheme_code and money_unit."
    - "Flags: count is_possible_duplicate (expect 10) and member_count_out_of_norm (expect 178)."

  regeneration_rules:
  - Re-profile NRLM.csv AND re-query megh_db. Diff every count here. Explain each change.
  - The table is a SNAPSHOT - a new extract replaces it. Every count in this file can move.
  - APPEND new canonical values and aliases. Never delete one - old questions must keep
    resolving.
  - Re-run the village ambiguity registry. If a name gains a code it must appear here.
  - Re-check shg_code uniqueness. If it breaks, the grain has changed - stop.
  - Re-check whether money gained a date column. If it did, the year-for-money refusal
    must be lifted across all seven files.
  - Bump resolver_version.
  companion_files:
  - Annotations/NRLM/nrlm_schema_partitions.yaml
  - Annotations/NRLM/nrlm_classification_rules.yaml
  - Annotations/NRLM/nrlm_foreign_key_augmentation.yaml
  - SCHEMA_FOR_DEVELOPERS.md
  - Annotations/NRLM/README.md
